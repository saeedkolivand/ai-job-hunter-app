[package]
name = "ajh-tauri"
version = "0.139.3"
edition = "2024"
# Real floor derived from `cargo metadata`'s per-package `rust_version` fields
# (highest wins): sysinfo 0.39.6 → 1.95, the next-highest is serial_test 4.0.1 →
# 1.93.1. Lower than the pinned toolchain (see rust-toolchain.toml) — that pin
# freezes what's already installed, this documents the actual minimum.
rust-version = "1.95"
description = "AI Job Hunter — Tauri desktop shell"
authors = ["Saeed Kolivand"]
# Application crate — never published to a registry. Marks it private so
# cargo-deny does not require a license field (see deny.toml [licenses].private).
publish = false

[features]
default = ["layout_pdf", "model_docx"]

# Render resumes through the canonical layout engine (model → LaidOutDoc → PDF)
# instead of the legacy renderer. On by default now that gap-by-gap snapshot
# parity with the legacy renderer is locked (see `layout::tests`). The legacy
# path stays compiled — it is the parity reference and still renders cover
# letters — so `--no-default-features` falls back to it.
layout_pdf = []

# Render resume DOCX from the canonical document model (real two-column table,
# native ats_mode) instead of the legacy line-based renderer. On by default;
# locked by golden invariants in `export::model_docx::test`. The legacy DOCX
# path stays compiled (it still renders cover letters), so `--no-default-features`
# falls back to it.
model_docx = []

# Application library — the whole app lives in `src/lib.rs` so it is reachable as
# `ajh_tauri::…` from integration tests and `benches/`. `src/main.rs` is a thin
# launcher. This is the canonical Tauri 2 lib + bin split.
[lib]
name = "ajh_tauri"

[[bin]]
name = "ajh-tauri"
path = "src/main.rs"

[profile.dev]
incremental = true

# Maximally optimized release binary (smallest + fastest): fat LTO + a single
# codegen unit + opt-level "s" + strip. The slow compile is acceptable — installer
# builds are manual and infrequent (see release.yml), so we trade build time for
# the best shipped artifact / smallest auto-update download.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# Crash reports are unreadable without symbols: `strip = true` discards the
# symbol table AND debuginfo, leaving every frame a bare address.
#   * `debug = "line-tables-only"` — file/line per frame, far cheaper than full
#     DWARF (no variables/types), which is all a stack trace needs.
#   * `split-debuginfo = "packed"` — that debuginfo goes to a SIDECAR
#     (.pdb / .dSYM / .dwp) instead of into the shipped binary, so users still
#     download a lean artifact. CI uploads the sidecar to Sentry; it is never
#     attached to the release.
#   * `strip = "debuginfo"` — strip leftover debuginfo but KEEP the symbol table,
#     so frames still resolve to names even if a symbol upload is ever missed.
# `lto`/`opt-level = "s"` still inline aggressively, so frames stay lossy by
# design — that trade was already made deliberately for artifact size.
strip = "debuginfo"
debug = "line-tables-only"
split-debuginfo = "packed"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
# Remote crash aggregation (ADR: crash reporting egress class). Pinned to the
# `sentry` MINOR the plugin itself depends on — `tauri-plugin-sentry` 0.6 builds
# against `sentry = "0.49"`, and a different `sentry` here would link a SECOND,
# type-incompatible copy of the SDK (the plugin's `init(&client)` would not accept
# our `Client`). sentry is pre-1.0, so each minor is a breaking major. Bump both
# together or not at all: a solo bump of either side duplicates
# sentry/sentry-core/sentry-types in the lock and fails to build — that is
# exactly why dependabot's plugin-only PR #972 was closed.
#
# The plugin's browser side ships a custom transport that forwards WebView events
# to the Rust SDK over `invoke`, so the renderer never egresses directly and the
# CSP `connect-src` allowlist stays untouched. There is no paired npm package to
# keep in step — that browser SDK is a `js_init_script` baked into the crate.
#
# Explicit features rather than defaults. sentry 0.49's default set is
# `backtrace + contexts + debug-images + logs + metrics + panic + transport +
# release-health`; we take neither `transport` nor the two new-in-0.49 telemetry
# features:
#   * `transport` = `reqwest + native-tls`, and sentry's `reqwest` feature also
#     switches on `tokio` — but the minidump supervisor is a bare forked process
#     with no async runtime to send on, so `ureq` is not merely the lighter
#     transport, it is the correct one. (Size matters too: sentry 0.49 wants
#     reqwest `0.13` with `blocking` + `json`. That is the app's own major, so it
#     would no longer be the duplicate crate sentry 0.42's reqwest 0.12 was — but
#     feature unification would still bolt `blocking` onto the shared client in a
#     binary this project optimizes hard for size (fat LTO, opt-level "s").)
#   * `logs` / `metrics` are structured-log and metric pipelines — new egress
#     surfaces. ADR-0020 consented to crash reports, and nothing here emits
#     either, so they stay off.
# `native-tls` IS on, and is reused rather than adding a second TLS stack —
# reqwest 0.13 already brings that crate in. In 0.49 the feature resolves to
# `ureq?/native-tls` for our transport (`reqwest?/native-tls-no-alpn` stays
# inert because `dep:reqwest` is never activated).
#
# Both `tauri-plugin-sentry` and `sentry-rust-minidump` declare sentry with
# `default-features = false`, so this declaration alone decides which transport
# the whole tree gets.
#
# BUMP CHECKLIST addition (0.49): `crash_reporting/transport.rs::is_opaque`
# keys off a private-repr behavior — `Items::Raw` yields an empty `items()`
# iterator and `add_item` early-returns on raw envelopes. Version-coupled; on
# any sentry/sentry-types bump, re-read `protocol/envelope.rs` for both facts
# (the `is_opaque_separates_raw_from_parsed` test fails loudly if they move).
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "release-health",
  "ureq",
  "native-tls",
] }
# `minidump` (default feature) pulls `sentry-rust-minidump` — 0.17 for plugin
# 0.6, transitively; we deliberately do not declare it ourselves — which
# supervises the app from a SEPARATE process. That is required, not a nicety:
# `[profile.release]` sets `panic = "abort"`, so nothing in-process can outlive a
# crash to flush it.
tauri-plugin-sentry = "0.6"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
# `ajh://` deep links → focus a specific autopilot. Every incoming URL/argv is
# validated against a strict route allowlist before navigation (see `deeplink`).
tauri-plugin-deep-link = "2"
# Opt-in launch-at-login (default OFF) so autopilot can run as a background
# discovery agent. Toggled only via our own `system_*` commands (Rust API), so
# no JS plugin capability is exposed; no extra launch args are registered.
tauri-plugin-autostart = "2"
# Least-privilege: `os:default`, `positioner:default`, and `store:default` are
# granted in capabilities/default.json AND now have renderer callers — `os`
# (platform()/isMacos via useWindowControls), `positioner` (resetPosition /
# "Reset window position" Settings action), and `store` (onboarding-mirror.ts).
# The `websocket`/`process`/`global-shortcut` JS ACL grants remain deferred until
# a caller exists (crates stay compiled, but no capability is exposed yet). OS
# info (platform/arch/version), process exit/restart, window positioning, global
# hotkeys (desktop-only init), a JSON key-value store, and a client WebSocket —
# all first-party Tauri v2 plugins, pinned to "2" like the block above.
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-positioner = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-websocket = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client used by all in-process scrapers and the AI/cover-letter pipeline.
# rustls-tls is added for the cover_letter pipeline (API calls use rustls client).
#
# No `rustls-native-certs`: in reqwest 0.13.1 that name was only the *implicit*
# feature of an optional dependency reqwest never references in its own source,
# so switching it on changed nothing. OS trust roots reach us either way — the
# `rustls` feature pulls `rustls-platform-verifier` (which depends on
# rustls-native-certs itself), and `native-tls` uses the system stack. reqwest
# 0.13.2 dropped the optional dependency outright, so keeping it listed is now a
# hard resolve error.
reqwest = { version = "0.13", features = ["json", "native-tls", "rustls", "cookies", "query", "http2"], default-features = false }

log = "0.4"
tracing = { version = "0.1", features = ["log"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
# Loopback-only WebSocket server for the browser-extension bridge (Feature 2).
# `default-features = false` drops the TLS feature set: the bridge binds 127.0.0.1
# and speaks plain `ws://` (no certs on loopback), so no rustls/native-tls is
# pulled in. Auth is layered in our handshake (Origin allowlist + per-frame token
# + size cap + SSRF guard), not TLS. See extension_bridge::auth.
#
# Pinned to 0.28 so its `tungstenite 0.28` matches the one chromiumoxide already
# pulls transitively (via async-tungstenite 0.32) — no duplicate tungstenite major
# is added to the tree.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

chromiumoxide = { version = "0.9", features = ["fetcher", "zip8"] }

futures = "0.3"
# Charset decoding for the streamed fetch_text body (mirrors reqwest's internal .text() path).
# Already a transitive dep via reqwest; declared explicitly so we can name it in scraping/http.
encoding_rs = "0.8"
regex = "1"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
feed-rs = "2"
urlencoding = "2"
rand = "0.10"
async-trait = "0.1"
arc-swap = "1.7"
parking_lot = "0.12"

uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"

base64 = "0.23"
scraper = "0.27"
flate2 = "1.0"

# OS-native secret storage: DPAPI (Windows), Keychain (macOS), libsecret (Linux).
# keyring v4 split into keyring-core (Entry API) + platform store crates.
keyring-core = "1"

sysinfo = { version = "0.39", default-features = false, features = ["system"] }

# Cross-platform dependencies
rusqlite = { version = "0.40", features = ["bundled"] }
pdf-extract = "0.12"
zip = "8"
docx-rs = "0.4.20"
lopdf = "0.44"
typst = "=0.15.1"
typst-pdf = "=0.15.1"
# `PagedDocument` moved out of `typst-library` into the `typst-layout` crate in
# 0.15, so the engine's compile path imports it directly. Already a transitive
# dep of `typst`; exact pin kept in lockstep with the rest of the family.
typst-layout = "=0.15.1"
# SVG emitter for the live-preview render path (render_*_svg_pages). Runtime dep:
# the preview command returns per-page SVG strings shown via <img> in the UI.
# Exact pin matches typst/typst-pdf. typst is already a runtime dep, so this is a
# small surface add over the existing Typst stack.
typst-svg = "=0.15.1"
image = "=0.25.10"

# ATS keyword matching: language-aware stemming + language detection (match_resume).
rust-stemmers = "1.2"
whatlang = "0.18"

# Browser-cookie import (scraping::board_login::import): decrypt Chromium
# `v10`/`v11` `encrypted_value` blobs (AES-256-GCM) after the OS-specific key is
# recovered (DPAPI on Windows, Keychain/libsecret on Unix). `rookie` was the
# preferred off-the-shelf option but is unusable here — it pins `rusqlite ^0.31`
# (libsqlite3-sys 0.28) which collides with our `rusqlite 0.40` (libsqlite3-sys
# 0.38) on the `links = "sqlite3"` native lib. So we hand-roll the v10 path and
# reuse our existing `rusqlite` to read the (copied, unlocked) Cookies DB.
aes-gcm = "0.11"

# SHA-256 over the (post-translation) job text, backing the match-cache text-hash
# guard: posting_vectors.text_hash and match_scores.job_text_hash use a
# deterministic, restart-stable hash so a stale or wrong-language cache row is a
# natural miss. Resolves to 0.10.9 already in the tree (lopdf/tauri-codegen).
sha2 = "0.11"
# HMAC-SHA256 for the extension-bridge v2 mutual challenge-response handshake
# (extension_bridge/handshake.rs): constant-time `Mac::verify_slice` of the
# client proof, keyed by the pairing token's UTF-8 bytes. Cross-platform (the
# `hmac = "0.13"` under `[target.'cfg(unix)']` pairs with sha1/digest-0.11 for
# Chromium cookie PBKDF2 and is NOT usable with sha2 0.10 / digest-0.10 here).
# 0.12.1 is already resolved in the lock and shares digest 0.10 with sha2 0.10.
hmac = "0.13"
htmd = "0.5.4"
# Real readability pass for `scraping::scrape_url`'s generic-HTML last resort:
# a faithful Rust port of Mozilla's Readability.js (used by Firefox Reader
# View). Replaces the old whole-document largest-`main`/`article`-block guess
# as the higher-precision fallback when neither the extension hint nor
# JSON-LD `JobPosting` matched — the guess itself stays as the final fallback
# below it. MIT-licensed — permitted under deny.toml's `[licenses] allow`
# list, enforced by CI's `cargo deny check`.
dom_smoothie = "0.18"

# IMAP client for email-confirmation watching (task #23, opt-in, default OFF —
# `email_watch`). `native-tls` (the crate's default), NOT `rustls-tls`: the
# `rustls-tls` feature bridges through `rustls-connector`, which is pinned to
# `rustls 0.22`/`rustls-webpki 0.102` (imap's own Cargo.toml caps
# rustls-connector at `^0.19`, so `cargo update` cannot bump past it) — that
# resolves 4 live RUSTSEC advisories (2026-0049/0098/0099/0104, all fixed only
# in rustls-webpki >=0.103.10) that `cargo deny check` fails on and no
# semver-compatible update path clears. `native-tls` instead reuses the SAME
# per-OS TLS stack `reqwest` already depends on (SChannel/SecureTransport/
# OpenSSL — see net/http.rs), so this is not a second TLS stack, just a second
# consumer of the one already in the tree. Sync API used only via
# `spawn_blocking` (see `email_watch::imap_client`); this is deliberately NOT
# `net::http` — IMAP is not HTTP and can't ride `reqwest` (see R5 note there).
# Exact-pinned (`=`), not caret: it's a pre-1.0 alpha on a credential-bearing
# path (the app password crosses this crate's LOGIN call) — an unreviewed
# float to alpha.16+ must not happen silently; bump it deliberately.
imap = { version = "=3.0.0-alpha.15", default-features = false, features = ["native-tls"] }
# Direct dep (not just via imap's `native-tls` feature above): `email_watch::
# imap_client` builds the TLS connection manually (TcpStream::connect_timeout
# + read/write timeouts, then wraps in TLS) because `imap::ClientBuilder::
# connect()` has no timeout at all and its timeout-capable `connect_with` is
# private. Pinned to the SAME 0.2.x line already resolved transitively via
# `imap`/`reqwest`'s own `native-tls` features — `cargo tree -p native-tls`
# confirms a single 0.2.18, no new duplicate version.
native-tls = "0.2"
# RFC5322/MIME parser for the poller's parser.rs — RFC2047 subject decode +
# text/plain body extraction from the raw bytes `imap_client` fetches. License
# verified via `cargo info mail-parser` (not assumed from the crate's Stalwart-
# relicensing news, which does NOT apply to this specific crate): "Apache-2.0
# OR MIT" — already deny.toml-allowed, no license-allow-list change needed.
mail-parser = "0.11.5"

[target.'cfg(windows)'.dependencies]
# Windows toast with a click callback. `tauri-plugin-notification`'s desktop
# `show()` is fire-and-forget (notify-rust) and its `onAction`/`register_listener`
# command is MOBILE-ONLY, so an OS-banner click could never reach the app — see
# `commands::notifications::show_os_notification`. Already in the tree
# transitively (notify-rust -> here); pinned to the locked 0.7.2 so no duplicate
# version / lockfile churn.
tauri-winrt-notification = "0.8.1"
wmi = "0.18"
windows-native-keyring-store = "1"
# DPAPI (CryptUnprotectData) to unwrap the Chromium os_crypt AES key on Windows;
# UI_ViewManagement reads the system accent color via UISettings (Appearance).
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "UI_ViewManagement", "Win32_System_Registry"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# CFNotificationCenter (distributed) → observe AppleColorPreferencesChangedNotification
# so the live OS accent-color watcher fires on macOS (mirrors the Windows WinRT watcher).
# Already in the tree transitively (core-graphics→tao→Tauri); pinned to the locked 0.8.7
# so no duplicate version / lockfile churn.
core-foundation-sys = "0.8.7"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
# Bounded subprocess wait for Flatpak probes: spawn + wait_timeout(2s) + kill so a
# hung `flatpak --version` / `flatpak info` never blocks browser detection.
wait-timeout = "0.2"

# Unix Chromium key derivation: PBKDF2-HMAC-SHA1 over the OS-stored "Safe
# Storage" password → AES-128-CBC decrypt of v10/v11 blobs (best-effort; the
# password comes from macOS Keychain / Linux libsecret). The `hmac` feature
# gates the bare `pbkdf2_hmac` fn; default features (password-hash) stay off.
[target."cfg(unix)".dependencies]
# Same OS-banner-click reason as `tauri-winrt-notification` above, for the
# macOS/Linux half: we need the `NotificationHandle` that
# `tauri-plugin-notification` never hands back. Version matches the plugin's own
# (`notify-rust = "4.11"`, locked to 4.18) so the two resolve to ONE copy.
notify-rust = "4.18"
aes = "0.9"
# `alloc` + `block-padding` expose `cipher` 0.5's Vec-returning
# `decrypt_padded_vec` (used by the Chromium cookie CBC decrypt in
# scraping/board_login/import.rs). Without them the method is gated out and the
# macOS/Linux release build fails to compile (the path is `cfg(not(windows))`,
# so it never surfaces in a Windows dev build).
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
# No direct `hmac` dep here — this crate never calls `hmac::` itself (only
# `pbkdf2::pbkdf2_hmac::<Sha1>`, below); `pbkdf2`'s own `hmac` feature pulls
# hmac 0.13 in transitively. A direct `hmac = "0.13"` here used to collide with
# the top-level `hmac = "0.12"` (extension-bridge handshake HMAC) in the extern
# prelude under `--all-features` (E0464: multiple candidates for `hmac`) — two
# DIRECT deps of the same name are ambiguous even on disjoint cfg targets, since
# `--all-features`/lockstep tooling can materialize both. Removing this direct
# entry leaves exactly one `hmac` in the direct-dependency namespace.
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = "0.11"

[dev-dependencies]
mockall = "0.15"
tempfile = "3.27"
proptest = "1.5"
serial_test = "4"
wiremock = "0.6.5"
# Additive feature merge onto the [dependencies] tokio entry (test-only — never
# ships in the binary): unlocks `#[tokio::test(start_paused = true)]` for the
# one salary_research timeout test, which would otherwise need a real 25s wait.
tokio = { version = "1", features = ["test-util"] }
# Rasteriser for the generate_templates_showcase_banner test — dev-only, NOT in the shipped binary.
typst-render = "=0.15.1"
# (typst-svg moved to [dependencies] — it now backs the live-preview render path.)
criterion = "0.8.2"

# Export hot-path benchmarks (request → PDF/DOCX bytes). Tracked over time by the
# advisory `.github/workflows/benchmark.yml`. `harness = false` → criterion owns main.
[[bench]]
name = "export_render"
harness = false
