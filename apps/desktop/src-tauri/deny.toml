# cargo-deny policy for the Rust core (docs/architecture-rules.md R11/R12).
# Run: `cargo deny check` (from apps/desktop/src-tauri). CI gates on this.

[graph]
# Only audit the platforms we actually ship.
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# RUSTSEC advisory database. Unmaintained/yanked crates are warnings (they are
# common deep in the tree and not always actionable); vulnerabilities fail.
version = 2
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # Add `"RUSTSEC-YYYY-NNNN", # reason + tracking link` here only for advisories
    # with no available fix, so the gate stays meaningful.
    # quick-xml <0.41 DoS-class advisories (quadratic attribute-duplicate
    # check; unbounded NsReader namespace allocation) — actually patched in
    # 0.39.4 per the GHSA data (cargo-deny's own "fixed in" field reports
    # >=0.41.0, which is misleading here). The one copy left below 0.41 is
    # 0.38.4 via citationberg 0.7.0 (typst -> hayagriva), its latest release;
    # a 0.x minor bump is breaking under cargo's semver rules, so there is no
    # cargo-update path. Exposure is bounded: typst parses our own generated
    # content. Upstream already moved to 0.41 (typst/citationberg#44, not yet
    # released). Remove when a citationberg release ships it.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # zip <9 extraction advisories (SUID/SGID bits kept, symlink targets and
    # Unix permissions applied outside the destination on `extract()`). The
    # app's own `zip` is already 9.x; the two old copies left are transitive
    # pins with no semver-compatible upgrade (tauri-plugin-updater 2.14 needs
    # zip 4, docx-rs 0.4.22 needs zip 8 — both are their latest releases).
    # Neither is reachable: the updater extracts only on Windows (no SUID
    # bits or Unix permissions there) and only after `verify_signature` has
    # checked the download against this project's own updater key; docx-rs is
    # used to WRITE documents only, and its zip reader is never called. The
    # third path (chromiumoxide's browser fetcher) was removed by dropping the
    # unused `fetcher`/`zip8` features. docx-rs has merged zip 9
    # (bokuweb/docx-rs#944, not yet released). Remove when those dependents
    # ship a zip 9 release.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
# Permissive + weak-copyleft licenses we accept. cargo-deny fails on anything
# not listed, so a new transitive license is a conscious decision (add it here
# with the crate that introduced it).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "bzip2-1.0.6",  # permissive BSD-style; pulled in via zip -> bzip2
]
confidence-threshold = 0.9
# `ajh-tauri` is a private, unpublished application crate with no license field;
# don't require one for our own code.
private = { ignore = true }
# Per-crate license clarifications (e.g. ring) are added here if cargo-deny
# cannot infer the license from the crate's files.
exceptions = []

[bans]
# Duplicate versions are a warning (the Tauri/chromiumoxide trees pull a few);
# wildcard version requirements are forbidden so the lockfile stays meaningful.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# `failspot` is a FAULT-INJECTION crate. It rides in transitively under the
# crash reporter (minidump-writer -> minidumper -> minidumper-child ->
# sentry-minidump -> sentry, via `sentry`'s `minidump` feature) and is inert
# as locked: its `enabled` feature is the only thing it has, it gates
# `dep:flagset`, and failspot's Cargo.lock entry lists no dependencies at all —
# proof the feature is off. (`flagset` IS in the lock, but via `dom_smoothie`,
# not this.)
#
# Turning it on would let a caller make the minidump writer fail on purpose, in
# the one component whose entire job is to still work when everything else has
# crashed. Nothing here should ever want that, so it is denied mechanically
# rather than left to whoever reads the next dependabot diff.
[[bans.features]]
crate = "failspot"
deny = ["enabled"]

[sources]
# Only crates.io by default; any git/registry source must be explicitly allowed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
