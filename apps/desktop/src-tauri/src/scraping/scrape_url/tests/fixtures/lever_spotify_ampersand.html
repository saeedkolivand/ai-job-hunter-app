<!DOCTYPE html><html><head><title>Spotify - Artist &amp; Label Partnerships Contractor, Vietnam</title><meta property="og:title" content="Spotify - Artist &amp; Label Partnerships Contractor, Vietnam" /><script type="application/ld+json">{"@context" : "http://schema.org","@type" : "JobPosting","title" : "Artist &amp; Label Partnerships Contractor, Vietnam","hiringOrganization" : {"@type" : "Organization","name": "Spotify","logo": "https://lever-client-logos.s3.us-west-2.amazonaws.com/0f50cbb4-b98b-444e-bf90-e2e61463d146-1738001993645.png"},"jobLocation":{"@type" : "Place","address" : {"@type" : "PostalAddress","addressLocality" : "Ho Chi Minh","addressRegion" : null,"addressCountry" : null,"postalCode" : null}},"employmentType" : "Short Term","datePosted" : "2026-08-27","description" : "<p>\n</p><p>Spotify is looking for a short-term contractor for the Artist &amp; Label Partnerships team in Vietnam.&nbsp;</p>\n<p>The Artist &amp; Label Partnerships team are the face of Spotify to artists, managers, labels &amp; distributors. Focusing on the Vietnamese music landscape, this role will serve as the point of contact for record labels, distributors and artists, ensuring that artists &amp; their teams are familiar with Spotify standard methodologies, resources and tools. The role will closely support the cross-functional teams with on-platform promotion and off-platform artist marketing. <br><br></p>\n<p>Please note this is a fixed-term, 6 months, contractor role hired through a third party.</p>\n<p></p>\\n<p></p><p><br></p><b>What You'll Do</b><ul>\n<li>Maintain positive partnerships across artist and label communities within Vietnam.</li>\n<li>Support our key partners in Vietnam on Spotify tools, resources and insights.</li>\n<li>Work closely with our cross functional teams to support artists and labels on priority releases in Vietnam</li>\n<li>Collaborate with the regional Music team to ensure content strategies are localized and successfully executed.</li>\n<li>Ensure Spotify has the best possible content offering in Vietnam and use this to further Spotify’s appeal to existing and new users.</li>\n</ul><p><br></p><b>Who You Are</b><ul>\n<li>You have at least 3+ years of working experience in the music/entertainment industry. Regional and global experience would be an added advantage.&nbsp;</li>\n<li>Extremely well organized, dedicated with the ability to plan, deliver on tight deadlines and pay outstanding attention to detail.</li>\n<li>You have a deep understanding and established network within the local music industry in Vietnam and have built relevant contacts with labels and artists to effectively collaborate with the community.</li>\n<li>You have a strong background in music and technology and a consistent record with operations.</li>\n<li>You have a strong grasp of content knowledge, music and cultural trends, artists, user engagement and behaviors.&nbsp;</li>\n<li>You have excellent stakeholder management skills.&nbsp;</li>\n<li>You have experience working within Vietnam and ideally across multiple markets within regional and global teams.</li>\n<li>You are very fluent in written and spoken English and Vietnamese.&nbsp;</li>\n<li>And finally, a great teammate, adapt well to change, and always have a positive demeanor.</li>\n</ul><p><br></p><b>Where You'll Be</b><ul>\n<li>This contract is based in Ho Chi Minh City, Vietnam.</li>\n</ul><p><br></p><p></p>\\n<p>Spotify is an equal opportunity employer. You are welcome at Spotify for who you are, no matter where you come from, what you look like, or what’s playing in your headphones. Our platform is for everyone, and so is our workplace. The more voices we have represented and amplified in our business, the more we will all thrive, contribute, and be forward-thinking! So bring us your personal experience, your perspectives, and your background. It’s in our differences that we will find the power to keep revolutionizing the way the world listens.</p>\n<p>&nbsp;</p>\n<p>At Spotify, we are passionate about inclusivity and making sure our entire recruitment process is accessible to everyone. We have ways to request reasonable accommodations during the interview process and help assist in what you need. If you need accommodations at any stage of the application or interview process, please let us know - we’re here to support you in any way we can.</p>\n<p>&nbsp;</p>\n<p>Spotify transformed music listening forever when we launched in 2008. Our mission is to unlock the potential of human creativity by giving a million creative artists the opportunity to live off their art and billions of fans the chance to enjoy and be passionate about these creators. Everything we do is driven by our love for music and podcasting. Today, we are the world’s most popular audio streaming subscription service.</p>"}</script></head><body><div class="posting-headline"><h2>Artist &amp; Label Partnerships Contractor, Vietnam</h2></div></body></html>
