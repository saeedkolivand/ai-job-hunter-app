<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Job Hunter Extension</title>
    <!-- No inline script/style: the bundled module (which imports its CSS) is
         loaded externally to satisfy the MV3 content security policy. -->
  </head>
  <body>
    <main class="app">
      <header class="head">
        <h1 class="title">
          AI Job Hunter
          <svg class="title__ul" viewBox="0 0 120 8" preserveAspectRatio="none" aria-hidden="true">
            <path d="M3 5 Q34 1 62 4 T117 4" />
          </svg>
        </h1>
        <div class="status" id="connection-pill-host">
          <!-- Retry button + status pill are built by the shared
               `connection-status.ts` module (ADR-046, also mounted by the
               side panel) — `prepend`-ed here so they land BEFORE #btn-help
               below in reading/tab order. -->
          <button
            id="btn-help"
            class="help"
            type="button"
            aria-label="More"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="menu"
          >
            ?
          </button>
        </div>
      </header>

      <!-- The launcher's "?" menu (PR0 §2, replaces the old bare help popover):
           Help center reveals the SAME explanatory text the popover always had
           (plus "Unpair this device"); Settings opens the options page;
           About shows the version. Exactly one of #menu/#help-popover/
           #about-popover is visible at a time — see popup.ts's `setPopover`. -->
      <div id="menu" class="menu" role="menu" hidden>
        <button id="menu-help" class="menu__item" type="button" role="menuitem">Help center</button>
        <button id="menu-settings" class="menu__item" type="button" role="menuitem">
          Settings
        </button>
        <button id="menu-about" class="menu__item" type="button" role="menuitem">About</button>
      </div>

      <div
        id="help-popover"
        class="help-popover"
        role="region"
        aria-label="How this works, and pairing options"
        hidden
      >
        <p>
          The extension talks to the desktop app only on your own computer (loopback). If the status
          shows “App not running”, open AI Job Hunter and reopen this popup.
        </p>
        <!-- Only shown while a pairing token is actually stored (toggled in
             render() from ConnectionStatus.hasToken) — nothing to unpair
             otherwise. -->
        <div id="unpair-group" class="help-popover__unpair" hidden>
          <p class="help-popover__hint">Reset pairing</p>
          <button id="btn-unpair" class="link" type="button">Unpair this device</button>
        </div>
      </div>

      <div id="about-popover" class="help-popover" role="region" aria-label="About" hidden>
        <p id="about-version"></p>
      </div>

      <!-- Import view: shown when paired + connected. -->
      <section id="view-import" class="view" hidden>
        <p class="hint">Import the job on this page into your desktop app.</p>

        <!-- Page-context card: title + the saved/applied chip (from
             `applied.check`), restyled onto the Notebook `.card`/`.tag`
             components — the logic driving it is unchanged from before this
             redesign (`resolveAppliedStatusLine`/`resolveShowMarkAppliedButton`
             in popup.ts). No stage strip here (unlike the panel's Job tab) —
             the popup must fit 360×≤520 without scrolling. -->
        <div id="job-card" class="card" hidden>
          <p id="job-card-title" class="job-title" hidden></p>
          <div class="chip-row">
            <span
              id="applied-status"
              class="tag tag--ok"
              role="status"
              aria-live="polite"
              hidden
            ></span>
          </div>
          <!-- Shown only for a found+saved applied.check result; hides itself
               once the job is marked applied (re-fires the same auto-check). -->
          <button id="btn-mark-applied" class="btn btn--quiet btn--small" type="button" hidden>
            Mark as applied
          </button>
        </div>

        <!-- Exactly three gesture actions (PR0 §2) — the SHARED job-tools
             component (`src/job-tools/job-tools.ts`, `hideSaveAnswers`), which
             the side panel also mounts with the fourth ("Save my answers")
             restored. Includes the fit chip + "why?" once Check fit ran. -->
        <div id="job-tools-host"></div>

        <button
          id="btn-open-panel"
          class="btn btn--quiet"
          type="button"
          title="Open these tools in the side panel, where they stay open while you fill the form"
        >
          Open the panel →
        </button>

        <!-- Best-effort summary of the shared answer-tools state for this tab
             (PR0 §2's "notice line") — the panel's Answers tab is where the
             rows themselves are edited; the popup only reports the count. -->
        <p id="answers-notice" class="msg msg--muted" role="status" aria-live="polite" hidden></p>

        <p id="import-msg" class="msg" role="status" aria-live="polite" hidden></p>
      </section>

      <!-- The pair / offline / outdated / searching views are built by the
           shared `connection-status.ts` module (ADR-046, also mounted by the
           side panel) — see that module's doc for what each renders. -->
      <div id="connection-views-host"></div>
    </main>

    <script type="module" src="./popup/popup.ts"></script>
  </body>
</html>
