name: 🚀 Release

# ──────────────────────────────────────────────────────────────────────
# Release Pipeline
# ──────────────────────────────────────────────────────────────────────
# Purpose: Manual semantic release + on-demand Tauri installer builds
# Triggers:
#   - workflow_dispatch only — nothing runs automatically on push to main
# Actions (select via the `action` input):
#   - release (default)   → semantic-release computes version from conventional
#       commits, syncs version files + CHANGELOG, creates the GitHub Release and tag,
#       and commits the bump back to main. Does NOT build installers.
#   - build-installers    → build Tauri apps + browser extension for a chosen
#       tag, then run the cask/manifest/download-page fan-out.
#   - publish-chrome / publish-firefox / publish-msstore / publish-snap → re-run ONE
#       store submission for a chosen tag, nothing else. For when one store's job
#       failed and the others went through: a store rejects a version it already
#       has, so re-running all of them would only redden the good ones.
# Jobs:
#   - release: Determine version, sync version files + changelog, create the
#       GitHub release, and commit the bump back to main (action: release only)
#   - build: Build Tauri apps for Windows, Linux, and macOS (action: build-installers only)
#   - package-extension: Build + attach browser extension zips (action: build-installers only)
#   - publish-chrome: Upload + submit the chrome zip to the Chrome Web Store listing
#   - publish-firefox: Build the AMO source archive, prove it rebuilds the shipped
#       package, then submit the new version to the Firefox AMO listing
#   - publish-msstore: Submit the packaged MSIX to the Microsoft Store listing.
#       Single-store re-run downloads the most recent msix-store-package artifact
#       from a prior build-installers run instead of rebuilding — there is no
#       cheap way to reproduce the unsigned .msix on demand (Windows-only Tauri
#       compile, never a Release asset by design), so this reuses build output
#       rather than a fresh compile (see the job's own comment)
#   - publish-snap: Pack the released .deb as a snap and upload it to the Snap
#       Store's `edge` channel (single-store re-run action — it only needs the
#       release .deb, not a rebuild)
#   - generate-update-manifest: Publish latest.json for the auto-updater
#   - update-cask: Pin the Homebrew cask to the built dmgs (version + per-arch sha256)
#   - update-download-page: Sync apps/landing/src/data/version.json to the built installer URLs
#
# How to release:
#   1. Actions → "🚀 Release" → Run workflow → action: release
#      semantic-release derives the bump from commit types (feat/fix/perf/BREAKING).
#   2. Actions → "🚀 Release" → Run workflow → action: build-installers
#      Leave the version blank for the latest tag, or pass one (e.g. 0.61.0).
#   3. Only if one store submission failed: action: publish-chrome,
#      publish-firefox, publish-msstore, or publish-snap with that same version.
# ──────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run'
        type: choice
        options:
          - release
          - build-installers
          - publish-chrome
          - publish-firefox
          - publish-msstore
          - publish-snap
        default: release
      version:
        description: 'Version to build installers / publish the extension for, e.g. 0.61.0 (blank = latest tag)'
        required: false
        type: string

# Least-privilege default; each job grants only the writes it actually uses.
permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 📦 Create Release
    # Versioning + release notes run on manual dispatch with action: release;
    # the installer build is a separate manual step (see the `build` job).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # semantic-release (@semantic-release/github + /git): push commits & tags,
      # create the GitHub Release, and comment on the issues/PRs it shipped.
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # @semantic-release/git pushes the release commit (CHANGELOG + version
          # files) to protected main over the deploy key the other jobs already use.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install Dependencies
        run: |
          echo "::group::Installing dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      - name: ⚙️ Configure Git
        run: |
          echo "::group::Configuring git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"

      - name: 🏷️ Run Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/git@10.0.1
            @semantic-release/exec@6.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0

      - name: 📝 Release Summary
        if: always()
        run: |
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Published | ${{ steps.semantic.outputs.new_release_published == 'true' && '✅ Yes' || '❌ No' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.semantic.outputs.new_release_version || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Resources" >> $GITHUB_STEP_SUMMARY
          echo "- [Semantic Release Docs](https://semantic-release.gitbook.io/semantic-release/)" >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Debug Environment on Failure
        if: failure()
        run: |
          echo "::group::Environment Variables"
          echo "Node Version: $(node --version)"
          echo "pnpm Version: $(pnpm --version)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref: $GITHUB_REF"
          echo "::endgroup::"

  build:
    name: 🏗️ Build Tauri Apps
    # Manual-only: installers are built on demand from the Actions tab
    # ("Run workflow" → action: build-installers) — the cross-platform compiles are
    # slow, so they're decoupled from the release flow. The build self-syncs version
    # files and checks out the resolved tag, so it needs nothing from the release job.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'build-installers' }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        # macOS compiles each arch as its own parallel leg (one runner each)
        # instead of building Intel then Apple Silicon sequentially on one
        # runner — that serial double-build was the slowest leg of the matrix.
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch_suffix: intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch_suffix: apple-silicon

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # Uploads installer assets to the GitHub Release (softprops/action-gh-release).
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository (for tag lookup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 🏷️ Resolve Version
        id: resolve
        env:
          # Passed via env (not inline) to avoid script injection from the input.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git tag --sort=-version:refname | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found. Create a release first or provide a version manually."
            exit 1
          fi

          VERSION="$(echo "$VERSION" | sed 's/^v*//')"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a valid version (got '$VERSION'). Pass one via the workflow input."
            exit 1
          fi
          # Using a non-secret prefix to prevent false positive secret masking
          # that would otherwise blank the output and break the manifest generator.
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building installers for v$VERSION"

      - name: 📥 Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: 💾 Restore Turbo Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🦀 Setup Rust
        # Pinned to the version in apps/desktop/src-tauri/rust-toolchain.toml
        # (enforced by `pnpm check:toolchain-pin`, which reads the trailing
        # "# <version>" comment below — keep it accurate)
        # (same SHA as .github/actions/setup-rust — bump both together).
        uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1

      # Three independent ways this step can block forever on a hosted runner,
      # each closed below. Without them it hung once for the full 60-minute job
      # timeout and took the whole release with it (every downstream job -
      # Create Release, update manifest, Homebrew cask, landing page - skipped).
      #
      # 1. needrestart is apt-hooked on ubuntu-22.04 and prompts "Which services
      #    should be restarted?", which nothing answers in CI. DEBIAN_FRONTEND
      #    alone does NOT suppress it - needrestart reads its own env var.
      # 2. unattended-upgrades holds the dpkg lock, and apt waits for it with no
      #    timeout by default. It is supposed to be disabled on hosted images and
      #    currently is not: actions/runner-images#13271 (open, regressed in the
      #    2025-10-23 images, affects 22.04 and 24.04). DPkg::Lock::Timeout makes
      #    the wait bounded instead of infinite.
      # 3. debconf can prompt on its own; DEBIAN_FRONTEND covers that one.
      #
      # timeout-minutes is the backstop that matters most: it turns "silently
      # burn the hour and lose the release" into "fail in 15, re-run".
      - name: 🐧 Install Linux Dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y -o DPkg::Lock::Timeout=300 \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl wget file

      - name: 💾 Restore Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
          # Separate cache per macOS arch so the two legs don't clobber each
          # other (empty on Windows/Linux — single cache as before).
          key: ${{ matrix.target }}

      - name: 📥 Install Dependencies
        run: |
          echo "::group::Installing dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      - name: 🔖 Sync Release Version
        run: |
          echo "::group::Syncing Tauri release metadata"
          VERSION="${{ steps.resolve.outputs.version }}"
          node scripts/sync-tauri-version.cjs "${VERSION#v}"
          echo "::endgroup::"

      - name: 🔨 Build Workspace
        run: |
          echo "::group::Building workspace packages"
          pnpm build:packages
          echo "::endgroup::"

      - name: 🎯 Add Rust Target (macOS only)
        if: runner.os == 'macOS'
        run: |
          echo "::group::Adding ${{ matrix.target }} target"
          rustup target add ${{ matrix.target }}
          echo "::endgroup::"

      - name: 🏗️ Build Tauri Application
        id: tauri-build
        continue-on-error: true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked in by build.rs → `option_env!("AJH_SENTRY_DSN")`. Set ONLY here,
          # so release installers report and every other build (local, CI checks,
          # contributor clones) compiles with no DSN and cannot transmit at all.
          AJH_SENTRY_DSN: ${{ secrets.AJH_SENTRY_DSN }}
        run: |
          echo "::group::Building Tauri application"
          if [ "${{ runner.os }}" == "macOS" ]; then
            # One arch per leg — the matrix runs Intel + Apple Silicon in parallel.
            pnpm --filter @ajh/desktop tauri build --target ${{ matrix.target }}
          else
            # Build for current platform (Linux or Windows)
            pnpm --filter @ajh/desktop tauri build
          fi
          echo "::endgroup::"

      - name: ❌ Check for Build Failures
        if: steps.tauri-build.outcome == 'failure'
        run: |
          echo "::error::Tauri build failed on ${{ matrix.platform }}. Please review the build output above."
          exit 1

      - name: 🔐 Verify Updater Signing Key
        if: steps.tauri-build.outcome == 'success'
        run: |
          echo "::group::Verifying updater signature key matches committed pubkey"
          # Fails the build if artifacts were signed with a key that does not
          # match the pubkey shipped in the app — which would break the
          # auto-updater for every user. See docs/DEPLOYMENT.md (Updater signing keys).
          node scripts/verify-updater-key.cjs
          echo "::endgroup::"

      # ── Microsoft Store (MSIX) ────────────────────────────────────────────
      # Wraps the SAME ajh-tauri.exe the NSIS installer ships (Tauri has no
      # MSIX target), so it runs after the build and before the renaming steps
      # below — those only touch bundle/ artifacts, not target/msix/.
      #
      # The package is UNSIGNED by design: the Microsoft Store signs it during
      # submission, so it must never be attached to the GitHub Release. It is a
      # build ARTIFACT, consumed by the `publish-msstore` job below. Skipped
      # entirely until the MSIX_* repository variables exist — Partner Center
      # assigns those values, so this ships before the listing does.
      # See docs/DEPLOYMENT.md § Microsoft Store (MSIX).
      #
      # Gated on ALL THREE variables, not just the first. The packer requires
      # every one and throws otherwise, and this step sits BEFORE the release
      # upload on the Windows leg — so a half-configured set would take the
      # Windows installers down with it. A partial set means "no MSIX this
      # release", never "no release".
      - name: 📦 Pack the Microsoft Store MSIX
        if: >-
          success() && matrix.platform == 'windows-latest' &&
          vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' &&
          vars.MSIX_PUBLISHER_DISPLAY_NAME != ''
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          echo "::group::Packing the Microsoft Store MSIX"
          node apps/desktop/scripts/pack-msix.mjs
          echo "::endgroup::"

      # Same three-variable gate as the pack step: with `if-no-files-found: error`
      # this would otherwise fail the Windows leg looking for a package the pack
      # step was skipped for.
      - name: ⬆️ Upload the MSIX artifact
        if: >-
          success() && matrix.platform == 'windows-latest' &&
          vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' &&
          vars.MSIX_PUBLISHER_DISPLAY_NAME != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: msix-store-package
          path: apps/desktop/src-tauri/target/msix/*.msix
          if-no-files-found: error
          retention-days: 90

      - name: 🏷️ Normalize Artifact Names
        if: success()
        run: |
          echo "::group::Normalizing artifact names (replacing spaces with dashes)"
          # Tauri keeps spaces from productName in artifact filenames. Replace spaces
          # with dashes so URLs in latest.json don't need encoding and the manifest
          # generator can match deterministic names across all platforms.
          # Scope note: this sweeps the WHOLE target/ tree, not just bundle/ — any
          # file with a space in its name, wherever it sits under target/, is
          # renamed. Nothing this repo stages there has spaces in its name
          # (target/msix/ is deliberately dash-named), but a future step that
          # writes one must expect it to be renamed here.
          if [ -d apps/desktop/src-tauri/target ]; then
            find apps/desktop/src-tauri/target -type f -name '* *' -print0 | \
              while IFS= read -r -d '' f; do
                dir="$(dirname "$f")"
                base="$(basename "$f")"
                new="${base// /-}"
                if [ "$base" != "$new" ]; then
                  mv "$f" "$dir/$new"
                  echo "Renamed: $base -> $new"
                fi
              done
          fi
          echo "::endgroup::"

      - name: 🏷️ Disambiguate macOS Artifact Architecture
        if: runner.os == 'macOS' && success()
        run: |
          echo "::group::Tagging macOS artifacts with architecture suffix"
          shopt -s nullglob
          # Each arch leg emits identically named .app.tar.gz / .dmg files and
          # both upload to the same release — without a suffix the two legs would
          # collide by name (and race the upload action). Suffix this leg's macOS
          # artifacts (and the updater .sig) with its architecture so names are
          # unique and latest.json can serve the correct binary per arch.
          tag_macos_artifacts() {
            local triple="$1" suffix="$2" base
            base="apps/desktop/src-tauri/target/${triple}/release/bundle"
            for f in "${base}"/dmg/*.dmg; do
              mv "$f" "${f%.dmg}-${suffix}.dmg"
              echo "Renamed (${suffix}): $(basename "$f")"
            done
            for f in "${base}"/macos/*.app.tar.gz; do
              mv "$f" "${f%.app.tar.gz}-${suffix}.app.tar.gz"
              echo "Renamed (${suffix}): $(basename "$f")"
            done
            for f in "${base}"/macos/*.app.tar.gz.sig; do
              mv "$f" "${f%.app.tar.gz.sig}-${suffix}.app.tar.gz.sig"
              echo "Renamed (${suffix}): $(basename "$f")"
            done
          }
          tag_macos_artifacts "${{ matrix.target }}" "${{ matrix.arch_suffix }}"
          echo "::endgroup::"

      - name: 🏷️ Prefix Artifacts With Platform
        if: success()
        run: |
          echo "::group::Prefixing artifacts with platform (windows-/macos-/linux-)"
          # Prepend "<os>-" to every uploadable bundle artifact so the flat,
          # alphabetically sorted GitHub Release asset list clusters by platform.
          # Upload globs are extension-based (*.exe, *.dmg, …) so they still match;
          # latest.json generation + the Homebrew cask reference the prefixed names.
          case "$RUNNER_OS" in
            Windows) p=windows ;;
            macOS)   p=macos ;;
            *)       p=linux ;;
          esac
          shopt -s nullglob
          base=apps/desktop/src-tauri/target
          for f in \
            "$base"/release/bundle/nsis/*.exe "$base"/release/bundle/nsis/*.sig \
            "$base"/release/bundle/msi/*.msi \
            "$base"/*/release/bundle/dmg/*.dmg \
            "$base"/*/release/bundle/macos/*.tar.gz "$base"/*/release/bundle/macos/*.tar.gz.sig \
            "$base"/release/bundle/deb/*.deb "$base"/release/bundle/rpm/*.rpm \
            "$base"/release/bundle/appimage/*.AppImage "$base"/release/bundle/appimage/*.AppImage.sig; do
            d=$(dirname "$f"); b=$(basename "$f")
            case "$b" in "$p"-*) continue ;; esac
            mv "$f" "$d/${p}-$b"
            echo "Prefixed: $b -> ${p}-$b"
          done
          echo "::endgroup::"

      # Debug files go to Sentry, NOT to the release. Without them every frame in
      # a crash report is a bare address; with them Sentry resolves names and
      # line numbers. Deliberately not attached as release assets — full DWARF
      # for this dep tree (typst, chromiumoxide, rusqlite) is very large, which
      # is the same reason the failure-log upload below is narrowly scoped.
      #
      - name: Upload Release Assets
        if: success()
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.resolve.outputs.version }}
          # Tauri only emits .sig files for NSIS, AppImage, and macOS .app.tar.gz
          # bundles (the targets the auto-updater consumes). MSI/DEB/RPM never
          # produce .sig artifacts so they're not listed.
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz.sig
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs AFTER the installers are published, and must NOT gate the job.
      #
      # `continue-on-error` is load-bearing here, not laziness. This step lives
      # inside a 4-leg matrix, and `generate-update-manifest`, `update-cask` and
      # `update-download-page` all sit behind a bare `needs: build`. Letting a
      # Sentry hiccup on ONE leg fail the job flips the aggregate result and
      # SKIPS all three — so `latest.json` is never written and auto-update
      # breaks for every existing user, while the installers sit attached to the
      # release. Unreadable stack traces are a far cheaper failure than a broken
      # updater.
      #
      # Loosening those three to `if: always() && ...` is not the fix either: it
      # would publish an updater manifest even when a platform's build genuinely
      # failed, pointing users at artifacts that do not exist.
      #
      # So failure is made loud instead of fatal — see the annotation step below.
      # A swallowed failure was the original sin; an unmissable one that doesn't
      # take the updater down with it is the trade.
      - name: 🔍 Upload debug symbols to Sentry
        id: sentry_symbols
        if: success()
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          # Guarded in the shell, not in `if:` — neither the `secrets` nor a
          # step's own `env` context is available to a step-level `if`.
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "::warning title=Sentry symbols skipped::SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECT are not all set, so crash reports from this release will show unresolved addresses."
            exit 0
          fi
          # Any failure past this point fails the job — the secrets are present,
          # so a failure means they are wrong or Sentry rejected the upload.
          set -euo pipefail
          echo "::group::Uploading debug files + sourcemaps"
          VERSION="${{ steps.resolve.outputs.version }}"
          npx --yes @sentry/cli@^2 releases new "${VERSION#v}"
          # Native debug files: PDB (Windows), dSYM (macOS), DWARF/dwp (Linux).
          # `split-debuginfo = "packed"` puts them beside the binary in target/.
          # No `--include-sources`: that would ship our source into Sentry, and
          # line tables alone are enough to resolve a frame.
          #
          # SCOPED, not a directory walk. Handing sentry-cli the whole `target/`
          # tree uploaded 474 files per leg (~1900 per release): dependency
          # build scripts, proc-macro .so files, ring/aws-lc-sys object files,
          # and every third-party system library bundled into the AppImage — all
          # to symbolicate one binary.
          #
          # Paths below are taken from an actual release run, not inferred. On
          # every platform the debug artifacts live in `release/deps/` under the
          # LIBRARY name (`ajh_tauri`, underscore) rather than the bin name
          # (`ajh-tauri`), and the copies under `release/`, `bundle/appimage/`
          # and `bundle/deb/` are hardlinks that dedupe to the same debug id:
          #   linux    deps/ajh_tauri-<hash>
          #   windows  deps/ajh_tauri.exe + deps/ajh_tauri.pdb
          #   macos    <triple>/deps/ajh_tauri-<hash> + .dSYM
          # macOS builds with an explicit --target so it nests under <triple>/;
          # `matrix.target` is empty on the other two, so that path just misses.
          # Non-debug siblings caught by the glob (.d dep-info) are ignored by
          # sentry-cli's own scan.
          BASE="apps/desktop/src-tauri/target"
          TRIPLE="${{ matrix.target }}"
          shopt -s nullglob
          # Only add the per-triple dir when there IS a triple: with TRIPLE empty
          # the path collapses to the same directory (`target//release/deps`) and
          # every file gets enumerated twice.
          DEPS_DIRS=("$BASE/release/deps")
          if [ -n "$TRIPLE" ]; then DEPS_DIRS+=("$BASE/$TRIPLE/release/deps"); fi
          DIFS=()
          for depsdir in "${DEPS_DIRS[@]}"; do
            if [ -d "$depsdir" ]; then
              for f in "$depsdir"/ajh_tauri*; do DIFS+=("$f"); done
            fi
          done
          if [ ${#DIFS[@]} -eq 0 ]; then
            echo "::error title=No debug files found::No ajh_tauri* artifacts under $BASE/**/release/deps on ${{ matrix.platform }} — nothing was uploaded, so crash reports from this release will show unresolved addresses."
            exit 1
          fi

          # "Non-empty" is not the same as "symbolicatable". Finding
          # `ajh_tauri.exe` while its `.pdb` is missing would pass the check
          # above and still ship unresolvable stack traces — this feature's
          # recurring failure shape. So assert the DEBUG COMPANION each platform
          # actually produces, as observed in a real release run:
          #   windows  a separate .pdb
          #   macos    a .dSYM bundle
          #   linux    none — DWARF stays inside the binary, nothing to require
          case "${{ runner.os }}" in
            Windows) NEED='\.pdb$';  NEED_DESC='a .pdb debug companion' ;;
            macOS)   NEED='\.dSYM$'; NEED_DESC='a .dSYM debug companion' ;;
            *)       NEED='';        NEED_DESC='' ;;
          esac
          if [ -n "$NEED" ] && ! printf '%s\n' "${DIFS[@]}" | grep -qE "$NEED"; then
            echo "::error title=Debug companion missing::Found ajh_tauri artifacts on ${{ matrix.platform }} but not $NEED_DESC, so frames from this release will not resolve. Check the release profile's debug/split-debuginfo settings."
            exit 1
          fi

          printf 'Uploading debug files:\n'
          printf '  %s\n' "${DIFS[@]}"
          npx --yes @sentry/cli@^2 debug-files upload "${DIFS[@]}"
          # Renderer sourcemaps — emitted as 'hidden', so they exist on disk here
          # but were never referenced from the shipped bundle.
          npx --yes @sentry/cli@^2 sourcemaps inject apps/desktop/dist/
          npx --yes @sentry/cli@^2 sourcemaps upload --release "${VERSION#v}" \
            apps/desktop/dist/
          npx --yes @sentry/cli@^2 releases finalize "${VERSION#v}"
          echo "::endgroup::"

      # The visibility half of the trade above. `continue-on-error` keeps the
      # matrix leg green so the release pipeline completes, but a failure must
      # never pass unremarked — that is exactly how this feature would end up
      # "working" while producing unreadable crash reports. An `::error::`
      # annotation surfaces at the top of the run, and the step summary puts it
      # on the run's landing page. Deliberately exits 0: raising here would
      # re-create the cascade this whole arrangement exists to avoid.
      - name: ❗ Flag a failed symbol upload
        if: always() && steps.sentry_symbols.outcome == 'failure'
        run: |
          MSG="Symbol upload failed on ${{ matrix.platform }} for ${{ steps.resolve.outputs.version }} — crash reports from this release will show unresolved addresses. Check SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT. Installers were published; the updater manifest was NOT affected."
          echo "::error title=Sentry symbol upload failed::$MSG"
          {
            echo "### ❗ Sentry symbol upload failed"
            echo ""
            echo "$MSG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📊 Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs-${{ matrix.platform }}-${{ github.run_id }}
          # Restrict to logs and bundler output to avoid uploading multi-GB
          # compiled artifacts. The full target/ tree is too large for CI.
          path: |
            apps/desktop/src-tauri/target/release/bundle/**
            apps/desktop/src-tauri/target/**/*.log
            apps/desktop/src-tauri/target/**/output
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: 📝 Job Summary
        if: always()
        run: |
          echo "## 🏗️ Tauri Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | \`${{ matrix.platform }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.tauri-build.outcome == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.resolve.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Node**: $(node --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rust**: $(rustc --version)" >> $GITHUB_STEP_SUMMARY
          echo "- **pnpm**: $(pnpm --version)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.tauri-build.outcome }}" == "failure" ]; then
            echo "### 📊 Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "Build logs uploaded: \`build-logs-${{ matrix.platform }}-${{ github.run_id }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### 🔗 Resources" >> $GITHUB_STEP_SUMMARY
          echo "- [Tauri Build Guide](https://tauri.app/v1/guides/building/)" >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Debug Environment on Failure
        if: failure()
        run: |
          echo "::group::Environment Variables"
          echo "Node Version: $(node --version)"
          echo "Rust Version: $(rustc --version)"
          echo "pnpm Version: $(pnpm --version)"
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform: ${{ matrix.platform }}"
          echo "::endgroup::"

  package-extension:
    name: 🧩 Package Extension
    # Manual-only: the browser extension is built + attached to the Release on
    # demand from the Actions tab ("Run workflow" → action: build-installers) —
    # mirrors the installer `build` job philosophy. Also the producer for a
    # single-store re-publish, which rebuilds the same tag's zips.
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["build-installers", "publish-chrome", "publish-firefox"]'), inputs.action) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Uploads the zipped extension to the GitHub Release (softprops/action-gh-release).
    permissions:
      contents: write

    steps:
      # `persist-credentials: false` on both checkouts: this job never pushes,
      # and the one step that needs the token (the release upload) takes it via
      # `env:` — so nothing here needs it sitting in .git/config while the
      # dependency install runs its lifecycle scripts.
      - name: 📥 Checkout Repository (for tag lookup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Resolve Version
        id: resolve
        env:
          # Passed via env (not inline) to avoid script injection from the input.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git tag --sort=-version:refname | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found. Create a release first or provide a version manually."
            exit 1
          fi

          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a valid version (got '$VERSION'). Pass one via the workflow input."
            exit 1
          fi
          # Using a non-secret prefix to prevent false positive secret masking
          # that would otherwise blank the output and break the manifest generator.
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging extension for v$VERSION"

      - name: 📥 Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: 📥 Install Dependencies
        run: |
          echo "::group::Installing dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      - name: 🔨 Build + Package Extension
        run: |
          echo "::group::Building shared packages"
          pnpm build:packages
          echo "::endgroup::"
          echo "::group::Building + zipping browser extension (manifest at zip root)"
          pnpm --filter @ajh/extension package
          echo "::endgroup::"

      - name: 📤 Upload Extension to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.resolve.outputs.version }}
          files: |
            apps/extension/dist/ai-job-hunter-extension-chrome-*.zip
            apps/extension/dist/ai-job-hunter-extension-firefox-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The store-publish jobs consume THESE bytes, not a re-download of the
      # release asset: the artifact is the exact zip this job just built and
      # verified, so what reaches the two stores cannot diverge from what is
      # attached to the GitHub Release.
      - name: 📦 Hand the zips to the store-publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extension-store-zips
          path: |
            apps/extension/dist/ai-job-hunter-extension-chrome-*.zip
            apps/extension/dist/ai-job-hunter-extension-firefox-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "## 🧩 Package Extension Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${{ steps.resolve.outputs.version }}\` |"
            echo ""
            echo "### 🔧 Environment"
            echo "- **Node**: $(node --version)"
            echo "- **pnpm**: $(pnpm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Store publishing ────────────────────────────────────────────────────────
  # Two jobs, not one: a rejection or an outage at one store must never stop the
  # other from shipping, and each store's outcome gets its own red/green. Neither
  # is a `needs:` of anything else (the update-manifest / cask / download-page
  # fan-out all hang off `build`), so a failed submission cannot take the rest of
  # the release down with it — keep it that way. No `continue-on-error`: a failed
  # submission has to be visibly red, or a release silently never reaches a store.
  #
  # Both jobs are terminal at "SUBMITTED FOR REVIEW". Approval is a human step at
  # Google/Mozilla that happens hours-to-days later and outside CI, so a green job
  # never means "live". Credential setup + failure modes: docs/DEPLOYMENT.md
  # § Browser extension store publishing.

  publish-chrome:
    name: 🧩 Publish to Chrome Web Store
    needs: package-extension
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'build-installers' || inputs.action == 'publish-chrome') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # PUBLIC item id — it is in every install URL. The same literal is pinned by
      # the desktop bridge's origin allowlist (ALLOWED_EXTENSION_IDS in
      # apps/desktop/src-tauri/src/extension_bridge/auth.rs) and linked from
      # apps/extension/README.md. Deliberately NOT a secret: hiding it would only
      # make a misconfigured upload harder to diagnose.
      CHROME_EXTENSION_ID: oaoekkgkhmgdfnpmfkpphgiikliaicll

    steps:
      # Fail on a missing credential HERE, with its own name, rather than four
      # steps later as an opaque 401 from Google. Guarded in the shell, not in
      # `if:` — the `secrets` context is not available to a step-level `if`.
      - name: 🔐 Check Chrome Web Store credentials
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Chrome Web Store credentials missing::Set these repository secrets before releasing (setup steps: docs/DEPLOYMENT.md § Browser extension store publishing):$missing"
            exit 1
          fi
          echo "All four Chrome Web Store secrets are set."

      # `persist-credentials: false` on both checkouts in this job: it never
      # pushes, so leaving the job token in .git/config would only mean it is
      # sitting there while 300+ npm lifecycle scripts run in the same workspace.
      - name: 📥 Checkout Repository (for tag lookup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Resolve Version
        id: resolve
        env:
          # Passed via env (not inline) to avoid script injection from the input.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git tag --sort=-version:refname | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found. Create a release first or provide a version manually."
            exit 1
          fi

          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a valid version (got '$VERSION'). Pass one via the workflow input."
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing extension v$VERSION to the Chrome Web Store"

      # The tag's lockfile is what pinned chrome-webstore-upload-cli at release
      # time, so the CLI is installed from the tag, not from main.
      - name: 📥 Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      # NO `env:` here, and it must stay that way: this step runs the lifecycle
      # scripts of the whole dependency tree. The store credentials belong only
      # to the step that actually talks to the store, below.
      - name: 📥 Install Dependencies
        run: |
          echo "::group::Installing dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      # Both zips come from one directory in package-extension, so they land at
      # the artifact root; the explicit path check below turns any surprise there
      # into a named error rather than a confusing upload.
      - name: 📥 Download the packaged extension zips
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-store-zips
          path: extension-zips

      - name: 🚀 Upload + submit to the Chrome Web Store
        id: cws
        env:
          # chrome-webstore-upload-cli takes the three OAuth values from these
          # exact variable names and REFUSES them as flags; PUBLISHER_ID is kept
          # alongside them so no credential is ever visible in a command line.
          # Access tokens last an hour — the CLI mints a fresh one from the
          # refresh token on every run.
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="extension-zips/ai-job-hunter-extension-chrome-${VERSION#v}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error title=Chrome zip missing::$ZIP was not in the extension-store-zips artifact — the package-extension job's naming and this job's expectation have drifted."
            exit 1
          fi
          echo "::group::chrome-webstore-upload (upload + publish)"
          # No subcommand = upload AND publish, i.e. submit for review. Two things
          # make this fail in ways worth recognising: the API refuses to act while
          # an unsubmitted manual draft edit is open in the dashboard, and it
          # refuses an upload whose manifest version does not increase (ours is
          # bumped for every app release by scripts/sync-tauri-version.cjs).
          # Output goes to the job log ONLY. The runner masks secrets in the log
          # stream; $GITHUB_STEP_SUMMARY is a file this step writes and the
          # runner uploads as-is, so unbounded output from a third-party tool
          # does not go in it.
          # Absolute path on purpose: `pnpm --filter … exec` runs the CLI from
          # apps/extension/, while the existence check above ran from the
          # workspace root — a relative path passes the check and then resolves
          # one directory too deep inside the CLI.
          pnpm --filter @ajh/extension exec chrome-webstore-upload \
            --source "$GITHUB_WORKSPACE/$ZIP" \
            --extension-id "$CHROME_EXTENSION_ID" \
            --deploy-percentage 100
          echo "::endgroup::"

      - name: 📝 Job Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "## 🧩 Chrome Web Store Submission"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION:-unresolved}\` |"
            echo "| Item | [\`$CHROME_EXTENSION_ID\`](https://chromewebstore.google.com/detail/$CHROME_EXTENSION_ID) |"
            echo "| Deploy percentage | 100 |"
            echo "| Outcome | ${{ steps.cws.outcome == 'success' && '✅ Submitted for review' || '❌ Failed' }} |"
            echo ""
            echo "The store CLI's own output is in the **Upload + submit to the Chrome Web Store** step log, where the runner's secret masking applies. It is deliberately not copied here."
            echo ""
            echo "> **Submitted ≠ live.** The last state this job can reach is _submitted for review_ (\`PENDING_REVIEW\`); the version goes live only when Google's review approves it, hours to days later. Track it in the [developer dashboard](https://chrome.google.com/webstore/devconsole)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-firefox:
    name: 🦊 Publish to Firefox AMO
    needs: package-extension
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'build-installers' || inputs.action == 'publish-firefox') }}
    runs-on: ubuntu-latest
    # The reproducibility gate below does a full workspace install + build of the
    # unpacked source archive, on top of this job's own install.
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: 🔐 Check AMO credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          missing=""
          for name in AMO_JWT_ISSUER AMO_JWT_SECRET; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=AMO credentials missing::Set these repository secrets before releasing (setup steps: docs/DEPLOYMENT.md § Browser extension store publishing):$missing"
            exit 1
          fi
          echo "Both AMO API secrets are set."

      # `persist-credentials: false` on both checkouts in this job: it never
      # pushes and `git archive` needs no network, so leaving the job token in
      # .git/config would only mean it is sitting there while two full dependency
      # installs' lifecycle scripts run in the same workspace.
      - name: 📥 Checkout Repository (for tag lookup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Resolve Version
        id: resolve
        env:
          # Passed via env (not inline) to avoid script injection from the input.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git tag --sort=-version:refname | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found. Create a release first or provide a version manually."
            exit 1
          fi

          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a valid version (got '$VERSION'). Pass one via the workflow input."
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing extension v$VERSION to Firefox AMO"

      # The source archive AMO reviewers rebuild from is `git archive` of THIS
      # checkout, so it has to be the release tag, not main.
      - name: 📥 Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      # NO `env:` on this step or the AMO tool install below, and it must stay
      # that way: between them they run the lifecycle scripts of the whole
      # workspace. WEB_EXT_API_KEY/SECRET can publish a Mozilla-signed version of
      # every add-on on the account, so they belong only to the single step that
      # talks to AMO.
      - name: 📥 Install Dependencies
        run: |
          echo "::group::Installing dependencies"
          pnpm install --frozen-lockfile
          echo "::endgroup::"

      # web-ext is pinned by its OWN committed package-lock.json in an isolated
      # npm project outside the pnpm workspace — `npx web-ext@<version>` would
      # pin only the entry package and re-resolve ~330 transitive dependencies,
      # unverified, in the job that holds the AMO credential. `--ignore-scripts`
      # because nothing in that tree needs a build step. Rationale + how to bump:
      # apps/extension/tools/amo/README.md.
      - name: 🧰 Install the pinned AMO submission tool
        run: |
          echo "::group::npm ci (apps/extension/tools/amo)"
          npm ci --ignore-scripts --prefix apps/extension/tools/amo
          echo "::endgroup::"

      # Both zips come from one directory in package-extension, so they land at
      # the artifact root; the explicit path checks below turn any surprise there
      # into a named error rather than a confusing upload.
      - name: 📥 Download the packaged extension zips
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extension-store-zips
          path: extension-zips

      # AMO requires reviewable source for a bundled (Vite) add-on. The archive is
      # `git archive` of the tag + a generated build README at its root — see
      # apps/extension/scripts/source-archive.mjs.
      - name: 📦 Build the AMO source archive
        run: |
          echo "::group::Building the AMO source archive"
          pnpm --filter @ajh/extension package:source
          echo "::endgroup::"

      # The gate that makes the archive worth submitting. AMO reviewers rebuild
      # from the submitted source and byte-diff the result against the uploaded
      # package; a mismatch delays the review or gets the add-on taken down. So
      # do exactly that here, and fail BEFORE anything is submitted.
      - name: 🔁 Verify the source archive rebuilds the shipped package
        id: repro
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          RAW="${VERSION#v}"
          SRC_ZIP="apps/extension/dist/ai-job-hunter-extension-source-${RAW}.zip"
          FF_ZIP="extension-zips/ai-job-hunter-extension-firefox-${RAW}.zip"
          for f in "$SRC_ZIP" "$FF_ZIP"; do
            if [ ! -f "$f" ]; then
              echo "::error title=Missing input::$f does not exist — the archive script's or the packager's naming and this job's expectation have drifted."
              exit 1
            fi
          done

          SRC_DIR="$RUNNER_TEMP/amo-source"
          SHIPPED_DIR="$RUNNER_TEMP/amo-shipped"
          rm -rf "$SRC_DIR" "$SHIPPED_DIR"
          mkdir -p "$SRC_DIR" "$SHIPPED_DIR"
          unzip -q "$SRC_ZIP" -d "$SRC_DIR"
          unzip -q "$FF_ZIP" -d "$SHIPPED_DIR"

          # web-ext re-zips --source-dir itself and silently drops anything
          # matching its default ignores. The comparison below is between
          # DIRECTORIES, so such a file would sail through this gate and still be
          # missing from what AMO actually receives. Assert the package contains
          # none rather than trusting that it never will.
          DROPPED="$(find "$SHIPPED_DIR" \( -name '.*' -o -name '*.zip' -o -name '*.xpi' -o -name 'node_modules' \) -printf '%P\n')"
          if [ -n "$DROPPED" ]; then
            echo "::error title=Package contains files web-ext would drop::web-ext's default ignore patterns (**/.*, **/*.zip, **/*.xpi, **/node_modules) would exclude these from the AMO upload even though the byte-diff passes, so the submitted add-on would not match the package:"
            echo "$DROPPED"
            exit 1
          fi

          echo "::group::Rebuilding from the source archive with its own documented commands"
          # Kept identical to SOURCE_BUILD_README.md's build steps on purpose: if
          # they ever diverge, the reviewer's rebuild is the one that fails.
          (
            cd "$SRC_DIR"
            pnpm install --frozen-lockfile
            pnpm -F @ajh/shared build
            pnpm -F @ajh/extension build:firefox
          )
          echo "::endgroup::"

          echo "::group::Diffing the rebuild against the shipped package"
          # `-q`, not a full diff: these are bundles on one line each, so a
          # character diff is a 200 kB unreadable log. Which FILES differ (or are
          # missing on either side) is the whole signal; the byte-level answer is
          # in the archive artifact this job attaches.
          if ! diff -rq "$SHIPPED_DIR" "$SRC_DIR/apps/extension/dist/firefox" > "$RUNNER_TEMP/repro.diff"; then
            echo "::error title=Source archive does not reproduce the package::AMO would reject this submission. NOTHING WAS SUBMITTED. Fix the non-determinism in the build (an absolute path or a timestamp leaking into the bundle is the usual cause) rather than loosening this comparison."
            cat "$RUNNER_TEMP/repro.diff"
            {
              echo "### ❌ Source archive did not reproduce the shipped package"
              echo ""
              echo "Nothing was submitted to AMO."
              echo ""
              echo '```'
              head -c 8000 "$RUNNER_TEMP/repro.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Rebuild is byte-identical to the shipped Firefox package."
          echo "::endgroup::"

      - name: 🚀 Submit the new version to Firefox AMO
        id: amo
        env:
          # THE ONLY step in this job that carries the AMO credential. web-ext
          # maps every option to a WEB_EXT_* variable, so these are passed as env
          # rather than flags and never land in the runner's process list. By the
          # time this runs, every dependency has already been installed and every
          # lifecycle script has already run, in steps with no secrets in scope.
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          RAW="${VERSION#v}"
          echo "::group::web-ext sign --channel listed"
          # `--channel listed` submits a new version of the existing public
          # listing (the add-on id comes from browser_specific_settings.gecko.id
          # in the manifest, so this can only ever update OUR listing).
          # `--approval-timeout 0` disables waiting for the signed XPI: a listed
          # submission goes to HUMAN review, so the default 15-minute wait would
          # end every run in a spurious failure. The job's terminal state is
          # "submitted".
          #
          # web-ext re-zips --source-dir itself, applying its own default ignores
          # (**/.*, **/*.zip, **/*.xpi, **/node_modules) — the reproducibility
          # gate above asserts the package contains nothing they would drop.
          #
          # Output goes to the job log ONLY: the runner masks secrets in the log
          # stream, but $GITHUB_STEP_SUMMARY is a file this step writes and the
          # runner uploads as-is.
          apps/extension/tools/amo/node_modules/.bin/web-ext sign \
            --channel listed \
            --source-dir "$RUNNER_TEMP/amo-shipped" \
            --upload-source-code "apps/extension/dist/ai-job-hunter-extension-source-${RAW}.zip" \
            --artifacts-dir "$RUNNER_TEMP/web-ext-artifacts" \
            --approval-timeout 0 \
            --no-input
          echo "::endgroup::"

      # Attached even when the gate or the submission failed: a rejected review
      # is reproduced by unpacking THIS archive, not by rebuilding from the tag.
      - name: 📤 Upload the AMO source archive
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amo-source-archive
          path: apps/extension/dist/ai-job-hunter-extension-source-*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: 📝 Job Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "## 🦊 Firefox AMO Submission"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION:-unresolved}\` |"
            echo "| Channel | \`listed\` |"
            echo "| Source archive rebuilds the package | ${{ steps.repro.outcome == 'success' && '✅ Byte-identical' || '❌ Not verified' }} |"
            echo "| Outcome | ${{ steps.amo.outcome == 'success' && '✅ Submitted for review' || '❌ Failed' }} |"
            echo ""
            echo "\`web-ext\`'s own output is in the **Submit the new version to Firefox AMO** step log, where the runner's secret masking applies. It is deliberately not copied here."
            echo ""
            echo "> **Submitted ≠ live.** A \`listed\` submission goes to human review at Mozilla; this job ends at _submitted_ and never waits for the signed XPI. Track it in [AMO Developer Hub](https://addons.mozilla.org/developers/addons)."
          } >> "$GITHUB_STEP_SUMMARY"

  # MSIX has no cheap standalone re-packaging step the way the browser
  # extension does (`package-extension`) — packing it happens inside the
  # expensive multi-platform Tauri `build` job, and the unsigned .msix is
  # never a GitHub Release asset the way Snap's .deb is (see the pack step's
  # own comment). A standalone `publish-msstore` re-run therefore does not
  # rebuild: it reuses the msix-store-package artifact a prior
  # `build-installers` run already produced (`retention-days: 90` on that
  # upload). `needs: build` still gates the build-installers case (waits for
  # THIS run's own fresh artifact); for a standalone dispatch `build` is
  # skipped rather than failed, which satisfies the implicit `success()` this
  # job's `if:` carries, so it still runs.
  publish-msstore:
    name: 🪟 Publish to Microsoft Store
    needs: build
    # `!cancelled()` is load-bearing, not decorative: with no status-check
    # function in this expression GitHub silently ANDs its own success() onto
    # it, and success() is false whenever a needed job's result is anything
    # but 'success' — including 'skipped'. `build` IS skipped for a
    # publish-msstore-only dispatch (its own `if:` only matches
    # build-installers), so without this, a standalone publish-msstore run
    # would always be skipped too, never reaching the cross-run fallback
    # below — caught by CodeRabbit, verified against GitHub's own documented
    # semantics before fixing. `needs.build.result == 'success'` keeps the
    # build-installers path exactly as strict as before (a genuinely FAILED
    # build must still block this job, only a SKIPPED one should not).
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && ((inputs.action == 'build-installers' && needs.build.result == 'success') || inputs.action == 'publish-msstore') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    env:
      # PUBLIC Store product id — it is in the listing URL and the download
      # page. Deliberately NOT a secret: hiding it would only make a
      # misconfigured submission harder to diagnose.
      MSSTORE_PRODUCT_ID: 9NC5KDJV0BTM

    steps:
      # Fail on a missing credential HERE, with its own name, rather than
      # several steps later as an opaque 401 from Partner Center. Guarded in
      # the shell, not in `if:` — the `secrets` context is not available to a
      # step-level `if`.
      - name: 🔐 Check Microsoft Store credentials
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          set -euo pipefail
          missing=""
          for name in MSSTORE_TENANT_ID MSSTORE_CLIENT_ID MSSTORE_CLIENT_SECRET MSSTORE_SELLER_ID; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Microsoft Store credentials missing::Set these repository secrets before releasing (setup steps: docs/DEPLOYMENT.md § Microsoft Store (MSIX)):$missing"
            exit 1
          fi
          echo "All four Microsoft Store secrets are set."

      # The MSIX pack step in `build` is itself gated on the MSIX_* repository
      # variables (Partner Center identity) — a partial/missing set skips
      # packing rather than failing the Windows leg, so this job would
      # otherwise find no artifact and fail with a confusing download error.
      # Same-run only (no run-id given): a standalone `publish-msstore`
      # dispatch skips `build` entirely, so this step is gated to the
      # build-installers case — the next step handles the standalone one.
      - name: 📥 Download the packaged MSIX (same-run)
        if: inputs.action == 'build-installers'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msix-store-package
          path: msix

      # Standalone re-run: no fresh artifact from this run to fall back on,
      # so reuse the most recent one `gh run download` can find across ALL
      # runs (it searches by name when no run-id is given) rather than
      # forcing a second full Windows compile just to retry a submission.
      # Verified against the resolved `version` input (when one is given) by
      # the version pack-msix.mjs embeds in the filename itself
      # (`AI-Job-Hunter_<version>_x64.msix`) — not by run metadata, since
      # workflow_dispatch inputs aren't queryable from the artifacts list.
      - name: 📥 Download the packaged MSIX (cross-run fallback)
        if: inputs.action == 'publish-msstore'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p msix
          if ! gh run download -n msix-store-package -D msix --repo "${{ github.repository }}"; then
            echo "::error title=No MSIX artifact found::No msix-store-package artifact exists (or every one has expired past its 90-day retention) — run action: build-installers first to produce one."
            exit 1
          fi
          MSIX="$(find msix -maxdepth 1 -name '*.msix' | head -n1)"
          if [ -z "$MSIX" ]; then
            echo "::error title=MSIX missing::Downloaded the msix-store-package artifact but it contained no .msix file — pack-msix.mjs's output naming and this job's expectation have drifted."
            exit 1
          fi
          if [ -n "${INPUT_VERSION:-}" ]; then
            TARGET="${INPUT_VERSION#v}"
            FOUND="$(basename "$MSIX" | sed -E 's/^AI-Job-Hunter_([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?_x64\.msix$/\1/')"
            if [ "$FOUND" != "$TARGET" ]; then
              echo "::error title=MSIX version mismatch::The most recent available msix-store-package artifact is for v$FOUND, not the requested v$TARGET. Run action: build-installers with version: $TARGET first to produce a fresh one for that version."
              exit 1
            fi
          fi
          echo "Using $(basename "$MSIX")"

      - name: 🟣 Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      # msstore-cli is NOT a .NET global tool (no NuGet package exists) —
      # it ships as a self-contained tarball per-OS from its own GitHub
      # releases. Verified against the sha256 the release publishes alongside it.
      - name: 📥 Install the Microsoft Store Developer CLI
        run: |
          set -euo pipefail
          echo "::group::Installing msstore CLI"
          cd "$RUNNER_TEMP"
          curl -sSLO https://github.com/microsoft/msstore-cli/releases/latest/download/MSStoreCLI-linux-x64.tar.gz
          curl -sSLO https://github.com/microsoft/msstore-cli/releases/latest/download/MSStoreCLI-linux-x64.tar.gz.sha256.txt
          # The .sha256.txt Microsoft publishes is UTF-16LE with a BOM, not
          # UTF-8 — sha256sum can't parse a checksum line with a null byte
          # after every character, so it must be converted first. iconv's
          # output still carries the BOM (now UTF-8-encoded), stripped by
          # the sed pass. Verified directly against the real download, not
          # assumed: sha256sum -c failed silently-wrong ("no properly
          # formatted checksum lines found") without this conversion.
          iconv -f UTF-16LE -t UTF-8 MSStoreCLI-linux-x64.tar.gz.sha256.txt | sed '1s/^\xEF\xBB\xBF//' | sha256sum -c -
          mkdir -p "$HOME/.local/msstore-cli"
          tar -xzf MSStoreCLI-linux-x64.tar.gz -C "$HOME/.local/msstore-cli"
          chmod +x "$HOME/.local/msstore-cli/msstore"
          echo "$HOME/.local/msstore-cli" >> "$GITHUB_PATH"
          echo "::endgroup::"

      # msstore-cli persists the client secret via libsecret (GNOME Keyring /
      # D-Bus Secret Service) on Linux, with no env-var bypass — verified
      # against its own source
      # (Services/CredentialManager/Unix/CredentialManagerUnix.cs calls
      # secret_password_store_sync/secret_password_lookup_sync
      # unconditionally, both platform-gated to Linux/macOS only). A bare
      # ubuntu-latest runner has neither a D-Bus session nor a keyring daemon
      # running, so both the write `reconfigure` does and the read `publish`
      # needs moments later would fail outright — this is what a real run
      # surfaced as a generic "Ops, something doesn't seem to be right!" from
      # the CLI's own catch-all, traced back to this via its source, not
      # guessed. The dbus-run-session + gnome-keyring-daemon --unlock pattern
      # below was verified end-to-end (a real store + lookup through
      # libsecret) in a headless WSL session before writing this.
      - name: 💾 Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: /var/cache/apt/archives/*.deb
          key: ${{ runner.os }}-apt-gnome-keyring-v1

      - name: 🔑 Install gnome-keyring
        run: sudo apt-get update -qq && sudo apt-get install -y gnome-keyring dbus-x11 libsecret-1-0

      - name: 🚀 Reconfigure + publish to the Microsoft Store
        id: msstore
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          set -euo pipefail
          MSIX="$(find msix -maxdepth 1 -name '*.msix' | head -n1)"
          if [ -z "$MSIX" ]; then
            echo "::error title=MSIX missing::No .msix file was in the msix-store-package artifact — pack-msix.mjs's output naming and this job's expectation have drifted."
            exit 1
          fi
          export MSIX

          # msstore-cli's settings.json does NOT follow XDG_DATA_HOME or
          # $HOME on this build/runtime — verified directly: exporting
          # XDG_DATA_HOME made no difference across two real runs, it always
          # lands relative to the process's own working directory instead
          # (confirmed at "$GITHUB_WORKSPACE/Microsoft/MSStore.CLI/settings.json").
          # reconfigure and publish already share the same CWD (no `cd`
          # between them), so that alone isn't the bug — reading the file's
          # actual CONTENT after reconfigure, at its REAL location, next.

          # reconfigure (writes the secret) and publish (reads it back) both
          # go through libsecret, so they must share the same live D-Bus
          # session — run together here rather than split across steps.
          dbus-run-session -- bash -c '
            set -euo pipefail
            eval "$(printf "%s\n" "ci" | gnome-keyring-daemon --unlock --daemonize --login)"

            echo "::group::msstore reconfigure"
            msstore reconfigure --verbose \
              --tenantId "$MSSTORE_TENANT_ID" \
              --sellerId "$MSSTORE_SELLER_ID" \
              --clientId "$MSSTORE_CLIENT_ID" \
              --clientSecret "$MSSTORE_CLIENT_SECRET"
            echo "::endgroup::"
            echo "::group::settings.json after reconfigure (no secret in this file — only in the keyring)"
            echo "pwd=$(pwd)"
            cat "Microsoft/MSStore.CLI/settings.json" 2>&1 || true
            # `msstore info --verbose` prints _configurationManager.ConfigPath
            # directly (its own resolved settings path), plus the loaded
            # SellerId/TenantId/ClientId — the actual source of truth, not a
            # guess from this shell about where the file "should" be.
            msstore info --verbose
            echo "::endgroup::"
            echo "::group::msstore publish (upload + submit)"
            # No --noCommit = upload AND submit for review, mirroring the
            # Chrome/Firefox jobs. Free products only — msstore publish
            # rejects a paid product outright (see docs/DEPLOYMENT.md).
            msstore info --verbose
            msstore publish "$MSIX" -id "$MSSTORE_PRODUCT_ID" --verbose
            echo "::endgroup::"
          '

      - name: 📝 Job Summary
        if: always()
        run: |
          {
            echo "## 🪟 Microsoft Store Submission"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Product | [\`$MSSTORE_PRODUCT_ID\`](https://apps.microsoft.com/detail/$MSSTORE_PRODUCT_ID) |"
            echo "| Outcome | ${{ steps.msstore.outcome == 'success' && '✅ Submitted for review' || '❌ Failed' }} |"
            echo ""
            echo "The CLI's own output is in the **Reconfigure + publish to the Microsoft Store** step log, where the runner's secret masking applies. It is deliberately not copied here."
            echo ""
            echo "> **Submitted ≠ live.** Certification review runs at Partner Center after this job ends; track it in the [developer dashboard](https://partner.microsoft.com/dashboard/products/$MSSTORE_PRODUCT_ID/overview)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-snap:
    name: 📦 Publish to the Snap Store
    # `needs: build` here is for the Actions graph grouping (and so
    # build-installers won't try to publish a snap of a build that failed),
    # not because this job needs anything build PRODUCES — packing a snap
    # only needs the release .deb, fetched straight from the GitHub Release
    # the same way update-cask reads dmg digests, so there is nothing
    # expensive to rebuild if just this store's submission failed. Same
    # `!cancelled()` + `needs.build.result` shape as publish-msstore: without
    # it, a standalone publish-snap dispatch (where `build` is skipped, not
    # failed) would itself always be skipped too — see that job's comment.
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && ((inputs.action == 'build-installers' && needs.build.result == 'success') || inputs.action == 'publish-snap') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 🔐 Check Snap Store credentials
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${SNAPCRAFT_STORE_CREDENTIALS:-}" ]; then
            echo "::error title=Snap Store credentials missing::Set the SNAPCRAFT_STORE_CREDENTIALS repository secret before releasing (setup steps: docs/DEPLOYMENT.md § Snap Store)."
            exit 1
          fi
          echo "SNAPCRAFT_STORE_CREDENTIALS is set."

      - name: 📥 Checkout Repository (for tag lookup)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Resolve Version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(git tag --sort=-version:refname | head -n1)"
          fi

          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found. Create a release first or provide a version manually."
            exit 1
          fi

          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Could not resolve a valid version (got '$VERSION'). Pass one via the workflow input."
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "raw=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing v$VERSION to the Snap Store"

      - name: 📥 Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.version }}
          fetch-depth: 1
          persist-credentials: false

      - name: 📥 Download the released .deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "::group::Downloading the release .deb"
          gh release download "$VERSION" --dir deb-download --pattern '*.deb'
          echo "::endgroup::"

      - name: 🧩 Extract the .deb + sync the manifest
        env:
          RAW: ${{ steps.resolve.outputs.raw }}
        run: |
          set -euo pipefail
          echo "::group::Extracting .deb contents"
          DEB="$(find deb-download -maxdepth 1 -name '*.deb' | head -n1)"
          if [ -z "$DEB" ]; then
            echo "::error title=.deb missing::No .deb file was in the v$RAW release assets."
            exit 1
          fi
          mkdir -p apps/desktop/src-tauri/linux/snap/deb-contents
          dpkg-deb -x "$DEB" apps/desktop/src-tauri/linux/snap/deb-contents
          # Fixed filename the manifest's `apps.ai-job-hunter.desktop` expects —
          # Tauri's deb bundler doesn't guarantee a stable one to hardcode there.
          DESKTOP_FILE="$(find apps/desktop/src-tauri/linux/snap/deb-contents/usr/share/applications -maxdepth 1 -name '*.desktop' | head -n1)"
          if [ -z "$DESKTOP_FILE" ]; then
            echo "::error title=.desktop missing::No .desktop file in the extracted .deb — Tauri's bundler output has drifted."
            exit 1
          fi
          cp "$DESKTOP_FILE" apps/desktop/src-tauri/linux/snap/deb-contents/usr/share/applications/ai-job-hunter.desktop
          echo "::endgroup::"

          echo "::group::Syncing snapcraft.yaml version"
          node scripts/sync-snapcraft.cjs "$RAW"
          echo "::endgroup::"

      - name: 🪚 Install snapcraft
        run: |
          echo "::group::Installing snapcraft"
          sudo snap install snapcraft --classic
          echo "::endgroup::"

      - name: 📦 Pack the snap
        id: pack
        run: |
          set -euo pipefail
          echo "::group::snapcraft pack"
          cd apps/desktop/src-tauri/linux/snap
          snapcraft pack
          SNAP_FILE="$(find . -maxdepth 1 -name '*.snap' | head -n1)"
          if [ -z "$SNAP_FILE" ]; then
            echo "::error title=Pack produced no .snap::snapcraft pack ran but no .snap file was found."
            exit 1
          fi
          echo "path=apps/desktop/src-tauri/linux/snap/${SNAP_FILE#./}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: 🚀 Upload to the Snap Store (edge channel)
        id: snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -euo pipefail
          echo "::group::snapcraft upload"
          # `edge`, not `stable`, on purpose: promoting to stable is a manual
          # `snapcraft release`/Snap Store web UI action once a build is
          # confirmed to install and run correctly — never flipped here.
          snapcraft upload --release=edge "${{ steps.pack.outputs.path }}"
          echo "::endgroup::"

      - name: 📝 Job Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          {
            echo "## 📦 Snap Store Submission"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Version | \`${VERSION:-unresolved}\` |"
            echo "| Channel | \`edge\` |"
            echo "| Outcome | ${{ steps.snap.outcome == 'success' && '✅ Uploaded' || '❌ Failed' }} |"
            echo ""
            echo "\`snapcraft\`'s own output is in the **Upload to the Snap Store (edge channel)** step log, where the runner's secret masking applies. It is deliberately not copied here."
            echo ""
            echo "> **Uploaded ≠ stable.** This job only ever publishes to \`edge\`. Install with \`snap install --edge ai-job-hunter\`, confirm it launches correctly, then promote to \`stable\` by hand (\`snapcraft release ai-job-hunter <revision> stable\` or the Snap Store web UI) — never automatically."
          } >> "$GITHUB_STEP_SUMMARY"

  generate-update-manifest:
    name: 📝 Generate Update Manifest
    # Runs after the manual installer build to (re)generate latest.json from the
    # uploaded signatures. Auto-skipped if the build was skipped or failed.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uploads latest.json to the GitHub Release (softprops/action-gh-release).
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 🏷️ Resolve Release Version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git tag --sort=-version:refname | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: 🏷️ Generate latest.json
        run: |
          echo "::group::Generating latest.json"
          VERSION="${{ steps.version.outputs.version }}"
          # Raw version for JSON (e.g., 0.70.0)
          RAW_VERSION="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Start JSON structure
          cat > latest.json << EOF
          {
            "version": "$RAW_VERSION",
            "notes": "See https://github.com/saeedkolivand/ai-job-hunter-app/releases/tag/$VERSION for details",
            "pub_date": "$PUB_DATE",
            "platforms": {
          EOF

          # Download all release assets to inspect
          gh release download "$VERSION" --dir temp/ || true

          # Debug: list all downloaded files
          echo "::group::All downloaded release files"
          ls -la temp/ || echo "temp directory is empty"
          echo "::endgroup::"

          # Filenames below match the normalized names produced by the
          # "Normalize Artifact Names" step in the build job (spaces -> dashes), plus
          # the OS prefixes from the "Prefix Artifacts With Platform" step.
          BASE_URL="https://github.com/saeedkolivand/ai-job-hunter-app/releases/download/$VERSION"

          # Windows (NSIS is the primary updater target)
          NSIS_SIG="temp/windows-AI-Job-Hunter_${RAW_VERSION}_x64-setup.exe.sig"
          if [ -f "$NSIS_SIG" ]; then
            SIG=$(tr -d '\n' < "$NSIS_SIG")
            echo '    "windows-x86_64": {' >> latest.json
            echo "      \"signature\": \"$SIG\"," >> latest.json
            echo "      \"url\": \"${BASE_URL}/windows-AI-Job-Hunter_${RAW_VERSION}_x64-setup.exe\"" >> latest.json
            echo '    },' >> latest.json
          else
            echo "::warning::Windows NSIS signature not found at $NSIS_SIG"
          fi

          # Linux (AppImage is the primary updater target)
          APPIMAGE_SIG="temp/linux-AI-Job-Hunter_${RAW_VERSION}_amd64.AppImage.sig"
          if [ -f "$APPIMAGE_SIG" ]; then
            SIG=$(tr -d '\n' < "$APPIMAGE_SIG")
            echo '    "linux-x86_64": {' >> latest.json
            echo "      \"signature\": \"$SIG\"," >> latest.json
            echo "      \"url\": \"${BASE_URL}/linux-AI-Job-Hunter_${RAW_VERSION}_amd64.AppImage\"" >> latest.json
            echo '    },' >> latest.json
          else
            echo "::warning::Linux AppImage signature not found at $APPIMAGE_SIG"
          fi

          # macOS — arch-specific .app.tar.gz bundles. Each arch build produces
          # its own (non-universal) bundle, so each updater target must point at
          # the matching file + signature. Names come from the macOS
          # disambiguation step in the build job (-intel / -apple-silicon).
          MAC_INTEL_SIG="temp/macos-AI-Job-Hunter-intel.app.tar.gz.sig"
          if [ -f "$MAC_INTEL_SIG" ]; then
            SIG=$(tr -d '\n' < "$MAC_INTEL_SIG")
            echo '    "darwin-x86_64": {' >> latest.json
            echo "      \"signature\": \"$SIG\"," >> latest.json
            echo "      \"url\": \"${BASE_URL}/macos-AI-Job-Hunter-intel.app.tar.gz\"" >> latest.json
            echo '    },' >> latest.json
          else
            echo "::warning::macOS Intel app bundle signature not found at $MAC_INTEL_SIG"
          fi

          MAC_ARM_SIG="temp/macos-AI-Job-Hunter-apple-silicon.app.tar.gz.sig"
          if [ -f "$MAC_ARM_SIG" ]; then
            SIG=$(tr -d '\n' < "$MAC_ARM_SIG")
            echo '    "darwin-aarch64": {' >> latest.json
            echo "      \"signature\": \"$SIG\"," >> latest.json
            echo "      \"url\": \"${BASE_URL}/macos-AI-Job-Hunter-apple-silicon.app.tar.gz\"" >> latest.json
            echo '    },' >> latest.json
          else
            echo "::warning::macOS Apple Silicon app bundle signature not found at $MAC_ARM_SIG"
          fi

          # Close JSON (remove trailing comma and close)
          sed -i '$ s/,$//' latest.json
          echo '  }' >> latest.json
          echo '}' >> latest.json

          cat latest.json
          echo "::endgroup::"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload latest.json to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: latest.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Append grouped Downloads table to release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "::group::Appending per-platform Downloads table to $VERSION notes"
          RAW="${VERSION#v}"
          URL="https://github.com/saeedkolivand/ai-job-hunter-app/releases/download/$VERSION"
          # Strip any prior block (idempotent) then re-append a fresh one.
          BODY="$(gh release view "$VERSION" --json body -q .body)"
          BODY="$(printf '%s' "$BODY" | sed '/<!-- downloads:start -->/,/<!-- downloads:end -->/d')"
          TABLE="$(cat <<EOF
          <!-- downloads:start -->
          ## 📥 Downloads

          | Platform | Get it |
          |----------|--------|
          | 🪟 Windows | [Microsoft Store](https://apps.microsoft.com/detail/9nc5kdjv0btm) · [Installer (.exe)]($URL/windows-AI-Job-Hunter_${RAW}_x64-setup.exe) · [MSI]($URL/windows-AI-Job-Hunter_${RAW}_x64_en-US.msi) |
          | 🍎 macOS (Apple Silicon) | [.dmg]($URL/macos-AI-Job-Hunter_${RAW}_aarch64-apple-silicon.dmg) |
          | 🍎 macOS (Intel) | [.dmg]($URL/macos-AI-Job-Hunter_${RAW}_x64-intel.dmg) |
          | 🐧 Linux | [AppImage]($URL/linux-AI-Job-Hunter_${RAW}_amd64.AppImage) · [.deb]($URL/linux-AI-Job-Hunter_${RAW}_amd64.deb) · [.rpm]($URL/linux-AI-Job-Hunter-${RAW}-1.x86_64.rpm) |
          | 🧩 Browser extension | [Chrome (.zip)]($URL/ai-job-hunter-extension-chrome-${RAW}.zip) · [Firefox (.zip)]($URL/ai-job-hunter-extension-firefox-${RAW}.zip) |

          _The Microsoft Store build is signed, so it installs without the SmartScreen warning the direct .exe/.msi downloads trigger; it may lag this tag by a day or two while Store certification runs. Installed apps auto-update — no need to re-download for new versions. The browser extension installs from its .zip (load unpacked / store upload)._
          <!-- downloads:end -->
          EOF
          )"
          gh release edit "$VERSION" --notes "$BODY"$'\n\n'"$TABLE"
          echo "::endgroup::"

  update-cask:
    name: 🍺 Update Homebrew Cask
    # Pins the cask to the just-built dmgs (version + per-arch sha256). Runs after
    # the build because that's the only point the dmgs — and their hashes — exist;
    # deliberately NOT in the push-only release job, which runs before any build
    # (so there'd be nothing to hash, and bumping the version there would point
    # the cask at dmgs that never ship). Reads each asset's
    # sha256 digest straight from the GitHub API (no download) and commits the
    # refreshed cask back to main. Skipped on the push path (build is manual).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `gh release view` only reads; the cask commit is pushed over the
    # RELEASE_DEPLOY_KEY (SSH), not the GITHUB_TOKEN — so read is enough.
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 🏷️ Resolve Release Version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git tag --sort=-version:refname | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🍺 Sync cask to the built dmgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "::group::Reading dmg sha256 digests for $VERSION"
          arm="$(gh release view "$VERSION" --json assets \
            -q '.assets[] | select(.name | endswith("aarch64-apple-silicon.dmg")) | .digest' | sed 's/^sha256://')"
          intel="$(gh release view "$VERSION" --json assets \
            -q '.assets[] | select(.name | endswith("x64-intel.dmg")) | .digest' | sed 's/^sha256://')"
          if [ -z "$arm" ] || [ -z "$intel" ]; then
            echo "::warning::dmg digests not found for $VERSION — skipping cask update"
            exit 0
          fi
          node scripts/sync-cask.cjs "${VERSION#v}" "$arm" "$intel"
          echo "::endgroup::"

      - name: 📤 Commit cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Casks/ai-job-hunter.rb; then
            echo "Cask already up to date."
            exit 0
          fi
          git add Casks/ai-job-hunter.rb
          git commit -m "chore: sync homebrew cask to ${VERSION} [skip ci]"
          git push git@github.com:saeedkolivand/ai-job-hunter-app.git HEAD:main

  update-download-page:
    name: 🌐 Update Landing Download Page
    # Pins the landing download page (apps/landing/src/data/version.json) to the just-built
    # installer assets — the versioned .dmg/.exe/.AppImage URLs only resolve once
    # the build has uploaded them. It also commits apps/landing/src/data/version.json back to
    # main, so it must run AFTER update-cask (the other main-pushing job) — both
    # did a bare `git push HEAD:main` in parallel and raced ("fetch first" reject).
    # Serializing via needs makes cask push first, then this job checks out the
    # updated main and pushes cleanly. generate-update-manifest is included so the
    # whole release fan-out drains before the final landing push. Rewrites the
    # marked block via scripts/sync-download-page.cjs and commits it back to main.
    #
    # NOTE: unlike the cask commit, this one deliberately omits `[skip ci]` — we
    # WANT the push to re-trigger pages.yml (it watches apps/landing/**) so the live
    # site redeploys with the fresh links. The push-only `release` job also fires
    # but no-ops (a lone chore commit yields no semantic-release version bump).
    needs: [build, update-cask, generate-update-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `git push` goes over the RELEASE_DEPLOY_KEY (SSH), not the GITHUB_TOKEN, so
    # read is enough here.
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: 🏷️ Resolve Release Version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(git tag --sort=-version:refname | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No release tags found"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 🌐 Sync download page to the built version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "::group::Pinning apps/landing/src/data/version.json to $VERSION"
          node scripts/sync-download-page.cjs "${VERSION#v}"
          echo "::endgroup::"

      - name: 📤 Commit download version data
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- apps/landing/src/data/version.json; then
            echo "Download version data already up to date."
            exit 0
          fi
          git add apps/landing/src/data/version.json
          git commit -m "chore: sync landing download version to ${VERSION}"
          git push git@github.com:saeedkolivand/ai-job-hunter-app.git HEAD:main
