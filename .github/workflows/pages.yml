name: 🌐 Deploy Landing Page

# ──────────────────────────────────────────────────────────────────────
# GitHub Pages Deploy
# ──────────────────────────────────────────────────────────────────────
# Purpose: Build the Next.js landing app (apps/landing, static export → out/)
#          plus the @ajh/ui Storybook (at /storybook/) and publish to GitHub Pages
# Triggers: push to main touching apps/landing/, packages/ui/, pnpm-lock.yaml, or
#           this workflow, plus manual dispatch
# Source:   apps/landing is a Next.js app with `output: 'export'` — `next build`
#           emits apps/landing/out (flat HTML/CSS/JS + the /public passthrough:
#           dashboards, benchmarks, CNAME, .nojekyll, og-card.jpg). The Storybook
#           build output is copied into out/storybook at deploy time only (never
#           committed).
# Note:     Runs independently of release.yml (also push-to-main) — separate jobs.
# ──────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deploy at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 📦 Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Persist Next.js's incremental build cache across deploys (silences the
      # "No build cache found" warning — nextjs.org/docs/messages/no-cache). The
      # key busts on dep or landing-source changes; restore-keys falls back to the
      # newest lockfile-scoped cache so an incremental rebuild still starts warm.
      - name: ♻️ Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: apps/landing/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/landing/src/**', 'apps/landing/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # The growth charts the home page embeds, plus the per-platform download
      # counts /download shows on its buttons, are regenerated daily by
      # 📈 Repo Charts and live on the orphan `badges` branch. They are pulled in
      # HERE rather than committed, because they are ~77 KB combined and change
      # every day (new date stamp, new data point). Committing them would grow
      # main's history for output nobody reads twice — the cost the parentless
      # `badges` branch exists to avoid. Deliberately not quantified as
      # 77 KB x 365: git deltas near-identical daily files hard, and most of
      # each SVG is an embedded font that never changes at all, so that
      # multiplication overstates it badly (it did, in this comment, before).
      #
      # Runs AFTER the Next.js cache step on purpose: that step's key hashes
      # apps/landing/public/**, so landing a file that changes daily before it
      # would bust the build cache every single night for no reason.
      #
      # Copying them into public/ keeps them SAME-ORIGIN. Pointing the page at
      # raw.githubusercontent.com instead would make this the first third-party
      # request the site has ever issued, sending every visitor's IP to GitHub on
      # page load — and it is blocked outright on /mission-control, whose CSP
      # sets `img-src 'self' data:` to close an Image()-beacon exfil path.
      - name: 📈 Fetch growth charts from the badges branch
        run: |
          set -euo pipefail
          git fetch --depth 1 origin badges
          for f in stars.svg downloads.svg downloads-by-platform.json; do
            git show "FETCH_HEAD:$f" > "apps/landing/public/$f"
            # `git show` into a redirect leaves an empty file behind on failure,
            # so check for content, not just existence. Failing the build is the
            # correct outcome: the last good site stays up, whereas shipping a
            # broken <img> onto the home page is a visible defect. Same rule as
            # readJsonArray in scripts/lib/downloads-history.mjs — never publish
            # reduced output quietly.
            [ -s "apps/landing/public/$f" ] || { echo "::error::$f missing or empty on the badges branch"; exit 1; }
            echo "fetched $f ($(wc -c < "apps/landing/public/$f") bytes)"
          done

      - name: 🏗️ Build landing (static export)
        run: pnpm --filter @ajh/landing build

      - name: 🔍 Check copy/link parity (no legacy content dropped)
        run: pnpm --filter @ajh/landing check:parity

      - name: 📚 Build Storybook (@ajh/ui)
        env:
          # Storybook's Vite bundle needs heap headroom on the CI runner.
          NODE_OPTIONS: --max-old-space-size=6144
        # Copy the static Storybook into the export output (runner-only;
        # apps/landing/out/storybook is never committed) so it ships in the artifact.
        run: |
          pnpm --filter @ajh/ui build-storybook
          cp -r packages/ui/storybook-static apps/landing/out/storybook

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/landing/out

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
