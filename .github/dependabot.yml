version: 2

updates:
  # The single root npm entry covers EVERY pnpm workspace member manifest via
  # the shared root pnpm-lock.yaml — apps/desktop, apps/extension, apps/landing
  # (rejoined the workspace in #740), and packages/*. Do NOT add per-member npm
  # entries: workspace members have no own lockfile, so a directory entry for
  # one would duplicate or fail.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 10

    # Wait for releases to age before opening a PR — keeps bot PRs from
    # colliding with the pnpm minimumReleaseAge gate (pnpm-workspace.yaml).
    cooldown:
      default-days: 2

    # One combined PR for routine minor+patch bumps; majors stay separate.
    # Named for the area so the PR title reads "bump the javascript group" —
    # this one entry is the whole JS side (renderer, extension, landing,
    # packages/*, build tooling), because they share the root lockfile and
    # cannot be split per-directory (see the note at the top of this entry).
    groups:
      # vitest and its @vitest/* companions peer-pin each other to the EXACT
      # same version (@vitest/browser-playwright 5.0.0 peers `vitest: 5.0.0`),
      # so a lone major bump of one of them breaks every vitest project at
      # startup (#1124 took the root `pnpm test` down with a missing export).
      # Bump the family in one PR, all update types, and keep it out of the
      # catch-all below — a lockstep group silently absorbed by a catch-all
      # stops being a lockstep group (same reasoning as typst in the cargo entry).
      vitest:
        patterns:
          - vitest
          - '@vitest/*'

      javascript:
        patterns:
          - '*'
        exclude-patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - minor
          - patch

    labels:
      - dependencies

    # typescript-eslint peers `typescript <6.1` — no TS 7 support yet (latest
    # 8.64 still caps there). The ROOT typescript stays on 6 so eslint's parser
    # works; apps/packages pin 7 themselves (real TS 7). Block major bumps so a
    # dependabot PR can't re-collapse that split by bumping root 6 -> 7 (#660).
    # apps/landing ALSO pins TS 6 for its own reason: Next 16's
    # verifyTypeScriptSetup breaks under TS 7's package layout (see the
    # "//typescript" note in apps/landing/package.json) — this same ignore
    # protects that pin too. Drop only when BOTH constraints clear.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # conventional-changelog-conventionalcommits v10 renders through
      # conventional-changelog-writer 9, but @semantic-release/release-notes-generator
      # (the 14.x that semantic-release 25 ships) still drives writer 8. A v10
      # preset therefore yields a header-only CHANGELOG and an empty GitHub
      # release body with NO error (it happened on v0.119.0);
      # scripts/guard-empty-release-notes.cjs now fails the release instead, and
      # this rule stops the major PR from re-opening. Lift it when a stable
      # release-notes-generator major ships on writer 9, and migrate the preset's
      # types config in release.config.mjs at the same time.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major

    commit-message:
      prefix: chore

  # The ONE legitimate exception to "no per-member npm entries" above:
  # apps/extension/tools/amo is deliberately NOT a pnpm workspace member
  # (pnpm-workspace.yaml globs apps/* and packages/*, which it does not match),
  # so it has its OWN package-lock.json rather than sharing the root one. It
  # pins web-ext for the release workflow's Firefox AMO submission — see that
  # directory's README.md for why it is isolated. Without this entry the pin
  # would silently rot, which is the whole reason it exists.
  - package-ecosystem: npm
    directory: /apps/extension/tools/amo
    schedule:
      interval: weekly

    open-pull-requests-limit: 2

    cooldown:
      default-days: 2

    labels:
      - dependencies

    # image-size reaches this tree only as web-ext -> addons-linter -> image-size
    # and carries DoS advisories whose sole npm-offered "fix" is downgrading
    # web-ext across a major, off the AMO submission API this job needs. A PR for
    # it can therefore never be merged, so don't open one. Not reachable in this
    # usage either: those parsers run in addons-linter's icon checks, which
    # `web-ext sign` never invokes, and the only images in scope would be our own
    # committed icons. Re-check when addons-linter widens its range.
    ignore:
      - dependency-name: image-size

    commit-message:
      prefix: chore

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly

    cooldown:
      default-days: 2

    labels:
      - dependencies

    # The typst family (typst, typst-pdf, typst-svg, typst-render,
    # typst-layout) is exact-pinned and must bump in lockstep — a partial
    # bump splits the pins (#851) and risks mixed-version rendering.
    groups:
      typst:
        patterns:
          - typst
          - typst-*

      # Everything else on the Rust side in ONE PR. `exclude-patterns` (which
      # beats `patterns`) keeps typst out regardless of group order. Without it
      # a typst bump would land inside this PR, where a partial bump is
      # invisible — the typst group above is only observable as a lockstep
      # unit while it still opens its own PR.
      desktop-rust:
        patterns:
          - '*'
        exclude-patterns:
          - typst
          - typst-*
        update-types:
          - minor
          - patch

    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    labels:
      - github-actions

    # codeql-action init/analyze must move in lockstep: init writes a config
    # stamped with its own version and a newer analyze refuses to load it.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action
          - github/codeql-action/*

      # Every other workflow action in ONE PR. Excluded from the codeql pair for
      # the same reason as typst above: a lockstep group that can be silently
      # absorbed by a catch-all stops being a lockstep group.
      ci-actions:
        patterns:
          - '*'
        exclude-patterns:
          - github/codeql-action
          - github/codeql-action/*
        update-types:
          - minor
          - patch
