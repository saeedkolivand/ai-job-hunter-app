# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit — ON-DEMAND AI PR review for this public repo (free OSS plan).
# Auto-review is OFF (reviews.auto_review.enabled: false): CodeRabbit stays
# silent on open/push and reviews ONLY when the owner comments "@coderabbitai
# review" on a PR — mirroring the on-demand "@claude review" workflow
# (.github/workflows/claude-review.yml). This keeps review spend/noise under
# explicit control; the deterministic merge gate in
# .github/workflows/ci-pipeline.yml and the SARIF security jobs (codeql/semgrep/
# scorecard/security) are what actually gate merge. Advisory only: CodeRabbit
# must NOT approve or block merge — only "✅ CI OK" gates.
#
# Conventions mirror AGENTS.md (canonical) + CLAUDE.md; ownership mirrors
# .claude/review-routes.json; labels mirror the former .github/labeler.yml.

language: en-US

tone_instructions: >-
  Be concise and technical; no filler. Only HIGH/CRITICAL findings block (arch
  violations, untested error/security paths, credential/IPC/updater exploits, data
  loss); the rest is advisory. Never approve or block — comment only.

reviews:
  profile: assertive
  # We never want CodeRabbit to gate merge — "✅ CI OK" is the only required check.
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  # On-demand only: no automatic review on open/push. Trigger a review by
  # commenting "@coderabbitai review" on the PR (see header note).
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - main

  # Skip generated / vendored / non-source noise so review focuses on real diffs.
  path_filters:
    - '!**/dist/**'
    - '!pnpm-lock.yaml'
    - '!**/Cargo.lock'
    - '!graphify-out/**'
    - '!**/*.gen.ts'
    - '!apps/desktop/src/renderer/routeTree.gen.ts'
    - '!**/__snapshots__/**'
    - '!**/*.snap'

  # Per-area guidance — mirrors the Primary-owner map in .claude/review-routes.json.
  # `path` is a single minimatch glob (brace alternatives group an area's dirs).
  path_instructions:
    - path: 'apps/desktop/src/renderer/**'
      instructions: >
        React renderer. The renderer rules (service hooks, @ajh/ui primitives,
        tokens, motion, i18n, feature isolation) are AGENTS.md rules 1-11, loaded
        as code guidelines — apply them from there. Also check that backend work
        survives navigation (AGENTS.md rule 16): subscriptions belong in
        routes/__root.tsx or a provider, not a route component.
    - path: 'packages/ui/**'
      instructions: >
        Design-system library. No Zustand, no IPC, no routing imports. Keep
        components presentational; tokens from css/tokens.css; accessibility
        (labels/roles/keyboard) matters.
    - path: 'apps/desktop/src-tauri/src/**'
      instructions: >
        Rust/Tauri backend. Respect L0–L3 layering (architecture rules R1–R8 in
        docs/architecture-rules.md — enforced by tests/architecture.rs). Use the
        centralized layers: errors via error.rs (AppError/AppResult), HTTP via
        net/http.rs, config/paths via platform/config.rs, spans via observability.rs.
        New board/provider variants go through registries, not hardcoded matches.
        Rust-first business logic. No unwrap/expect on fallible runtime paths.
    - path: 'packages/shared/**'
      instructions: >
        IPC contracts / Zod schemas / shared types. No React, no Node APIs. Keep the
        Rust mirror + the TS contract in sync (the 5-step IPC capability flow).
    - path: 'apps/desktop/src-tauri/src/{commands/ai.rs,commands/ai_provider/**,documents/**}'
      instructions: >
        AI providers / embeddings. Adding a provider must be config + adapter only —
        never business-logic coupling. Watch prompt-injection and secret leakage;
        keep streaming/token usage efficient.
    - path: 'packages/prompts/**'
      instructions: >
        Prompt templates: pure TS, zero deps, no UI, no window. Provider-aware +
        locale-driven. Watch for injection-prone interpolation.
    - path: 'apps/desktop/src-tauri/src/{export,model,theme,locale,layout,measure,contact_profile}/**'
      instructions: >
        Resume/export domain. Preserve the DocumentModel contract, ATS-safe
        formatting/layout, and locale/country standards. Flag golden-snapshot
        impact for PDF/DOCX rendering changes.
    - path: 'apps/desktop/src-tauri/src/{commands/match_resume.rs,commands/cover_letter.rs,cover_letter/**,recommend/**,validate/**}'
      instructions: >
        ATS scoring / job-match / cover-letter relevance. Keep scoring rules and
        keyword/skill/requirement extraction consistent; validators stay relaxed/
        future-proof (no hard enum gates that reject new variants).
    - path: 'apps/desktop/src-tauri/src/{scraping,browser}/**'
      instructions: >
        Scraping / browser automation. Resilient selectors, rate-limiting,
        cancellation, and registry-driven boards (SCRAPERS). No brittle hardcoded
        DOM assumptions.
    - path: 'apps/extension/**'
      instructions: >
        Browser extension (MV3). No dynamic import() in the background service
        worker (Vite __vitePreload touches window/document → "window is not
        defined"); use static imports. The pairing token only travels to the
        loopback desktop bridge, never a remote host.
    - path: 'apps/desktop/src-tauri/{capabilities/**,tauri.conf.json,src/net/**,src/credentials/**,src/commands/credentials.rs,src/commands/privacy.rs,src/updater/**}'
      instructions: >
        SECURITY-SENSITIVE surface (tauri-security-reviewer checklist): capabilities,
        IPC attack surface, secrets/credentials, updater, rate-limit/cost/export
        limits. Scrutinize new IPC commands and permission widening. Flag
        HIGH/CRITICAL.
    - path: '**/{Cargo.toml,package.json,deny.toml}'
      instructions: >
        Dependency/policy manifests — supply-chain surface. Justify each added
        dependency; flag risky/unmaintained packages and license/policy issues.
    - path: '{**/*.test.*,**/*.spec.*,apps/desktop/src-tauri/tests/**,**/e2e/**}'
      instructions: >
        Tests. Check for weak assertions, over-mocking, flakiness, and untested
        edge/error/security paths on the changed code. Flag source changes that
        ship without a matching test update.
    - path: 'docs/**'
      instructions: >
        Docs/knowledge base must be thin pointers into the owning source/symbol —
        no copied literals; keep them from drifting. If the page opens with a
        `GENERATED FILE` banner it is rendered by a script and cannot be hand-edited:
        raise the finding on the source it renders from (the TSDoc on the contract
        member), never as an edit to the page itself.

  # PR-level checks. All advisory (warning): CodeRabbit never gates merge.
  pre_merge_checks:
    docstrings:
      mode: 'off' # repo docs are thin pointers (AGENTS.md rule 17), not coverage
    title:
      mode: warning
      requirements: >-
        Conventional commit: type in feat|fix|perf|refactor|ui|style|test|docs|build|ci|chore|revert,
        optional (scope), lowercase subject (acronyms too), imperative, <=100 chars, no trailing period.
    description:
      mode: warning
    issue_assessment:
      mode: warning

  # Only HIGH/CRITICAL block (AGENTS.md "Review conventions"); this is what
  # CodeRabbit's merge/security risk ratings should measure.
  merge_risk_instructions: >-
    High risk: architecture-rule violations (tests/architecture.rs, AGENTS.md rules 12/14/16),
    data loss or corruption in local stores, sync or migrations, an untested error path the PR
    introduces, a broken IPC contract or renderer/Rust mirror. Low risk: docs, copy, tests-only,
    style.
  security_risk_instructions: >-
    High risk: credential or keychain exposure, IPC attack surface or capability widening, updater
    or signature checks, network egress outside ADR 0005, prompt injection or leakage in
    ai_provider/prompts, the extension bridge pairing token, and unbounded reads of files or
    network input.

  # The repo has its own test-author and docs flow, and Autofix needs paid credits.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # Area labels — mirrors the retired .github/labeler.yml path→label map. CodeRabbit
  # applies labels by name from these instructions.
  labeling_instructions:
    - label: 'app/extension'
      instructions: 'Apply when files under apps/extension/** change.'
    - label: 'app/desktop'
      instructions: 'Apply when files under apps/desktop/** change.'
    - label: 'pkg/shared'
      instructions: 'Apply when files under packages/shared/** change.'
    - label: 'pkg/ui'
      instructions: 'Apply when files under packages/ui/** change.'
    - label: 'pkg/prompts'
      instructions: 'Apply when files under packages/prompts/** change.'
    - label: 'pkg/translations'
      instructions: 'Apply when files under packages/translations/** change.'
    - label: 'rust'
      instructions: 'Apply when files under apps/desktop/src-tauri/** change.'
    - label: 'frontend'
      instructions: 'Apply when files under apps/desktop/src/renderer/** change.'
    - label: 'dependencies'
      instructions: 'Apply when package.json, pnpm-lock.yaml, Cargo.toml, or Cargo.lock change.'
    - label: 'github_actions'
      instructions: 'Apply when files under .github/** change.'
    - label: 'documentation'
      instructions: 'Apply when docs/** or any *.md file changes.'

  # In-PR linters/SAST. These post advisory inline comments; the deterministic
  # gating ESLint/Clippy/fmt remain in ci-pipeline.yml, and the SARIF Semgrep
  # (Security tab) remains in security.yml.
  tools:
    eslint:
      enabled: true # replaces the retired reviewdog ESLint lane
    actionlint:
      enabled: true # replaces the retired reviewdog actionlint lane
    gitleaks:
      enabled: true # net-new: secret scanning on the diff
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    semgrep:
      enabled: true
    biome:
      enabled: false # repo uses ESLint + Prettier, not Biome

chat:
  auto_reply: true

knowledge_base:
  # AGENTS.md, CLAUDE.md and .claude/rules/** are read as review guidelines by
  # default; never list them in path_instructions (they'd be reviewed as code).
  code_guidelines:
    enabled: true
  learnings:
    scope: local
